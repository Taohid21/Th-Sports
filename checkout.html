<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Product & Checkout | TH Sports Bangladesh</title>
  <link rel="icon" type="image/jpeg" href="https://gcdnb.pbrd.co/images/X64gpxh4sBU_.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #162d59;
      --navy-deep: #0c1a36;
      --orange: #f04e23;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { overflow-x: hidden; max-width: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif;
      background: #ffffff; color: var(--text); padding-bottom: 60px;
      display: flex; flex-direction: column; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    @media (min-width: 992px) { body { padding-bottom: 0; } }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; }

    /* Top Slim Progress Bar */
    .top-progress {
      position: fixed; top: 0; left: 0; height: 2.5px; width: 0%;
      background: linear-gradient(90deg, var(--orange), #ff7a52);
      z-index: 999; transition: width 0.35s ease, opacity 0.3s ease;
    }

    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.97); backdrop-filter: blur(12px);
      height: 60px; border-bottom: 1px solid var(--border); padding: 0 16px;
    }
    .header-inner { max-width: 1050px; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .icon-btn { background: none; border: none; color: #1e293b; cursor: pointer; position: relative; display: inline-flex; padding: 4px; }
    .icon-btn svg { width: 22px; height: 22px; stroke-width: 1.85; }
    .cart-badge {
      position: absolute; top: -3px; right: -6px; background: var(--orange); color: #fff;
      font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 99px;
      display: none; align-items: center; justify-content: center; border: 1.5px solid #fff;
    }
    .cart-badge.show { display: flex; }

    .brand-logo { display: flex; align-items: center; gap: 9px; }
    .logo-circle {
      width: 38px; height: 38px; border-radius: 50%; overflow: hidden;
      border: 1.5px solid var(--orange); background: var(--navy);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand-text-col { display: flex; flex-direction: column; line-height: 1; }
    .brand-title { font-size: 19px; font-weight: 800; font-style: italic; letter-spacing: -0.5px; color: var(--navy); }
    .brand-sub { font-size: 8px; font-weight: 700; letter-spacing: 3px; color: var(--orange); text-align: right; margin-top: 2px; }

    .container { max-width: 980px; width: 100%; margin: 0 auto; flex: 1; }

    /* Skeleton Loader */
    .skel-wrap { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .skel-box {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 12px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .top-intro { background: #f8fafc; padding: 12px 16px 14px; border-bottom: 1px solid #f1f5f9; }
    .breadcrumb { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .prod-main-title { font-size: 17.5px; font-weight: 700; color: var(--navy); line-height: 1.35; }

    /* Media Gallery + Interactive Click-Point Zoom */
    .showcase-wrap { padding: 14px 14px 6px; background: #fff; }
    .gallery-card {
      position: relative; width: 100%; background: #fff;
      border: 1.5px solid rgba(240, 78, 35, 0.78); border-radius: 16px;
      overflow: hidden; min-height: 270px; display: flex; align-items: center; justify-content: center;
    }
    .zoom-stage {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      overflow: hidden; cursor: zoom-in; position: relative; padding: 10px;
    }
    .zoom-stage.is-zoomed { cursor: zoom-out; touch-action: none; }
    .zoom-stage img {
      width: 100%; max-height: 400px; object-fit: contain; display: block;
      transition: transform 0.2s ease-out; will-change: transform; user-select: none; -webkit-user-drag: none;
    }
    .zoom-stage.is-zoomed img { transition: transform 0.06s linear; }
    .gallery-card iframe, .gallery-card video { width: 100%; aspect-ratio: 16/9; max-height: 400px; border-radius: 10px; border: none; background: #000; }

    .gal-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.92);
      border: 1px solid var(--border); width: 32px; height: 32px; border-radius: 50%; color: var(--navy);
      cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .gal-prev { left: 8px; } .gal-next { right: 8px; }
    .expand-btn {
      position: absolute; top: 10px; right: 10px; z-index: 6;
      background: rgba(255,255,255,0.9); border: 1px solid var(--border); color: var(--navy);
      width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .thumb-strip { display: flex; gap: 8px; padding: 8px 14px 10px; overflow-x: auto; }
    .thumb-item {
      width: 60px; height: 60px; flex-shrink: 0; border-radius: 10px; border: 1.5px solid var(--border);
      overflow: hidden; cursor: pointer; background: #fff; padding: 3px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .thumb-item.active { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(240, 78, 35, 0.16); }
    .thumb-item img { width: 100%; height: 100%; object-fit: contain; }
    .thumb-vid-badge { position: absolute; inset: 0; background: rgba(15,23,42,0.45); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }

    .details-body { padding: 4px 16px 20px; }
    .rating-summary { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
    .stars { color: var(--orange); font-size: 14px; letter-spacing: 1px; }
    .add-rev-link { color: var(--navy); text-decoration: underline; cursor: pointer; font-weight: 600; }

    .price-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .price-pill { font-size: 24px; font-weight: 800; color: var(--navy); }
    .reg-strike { font-size: 15px; color: #94a3b8; text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .stock-text { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 16px; }
    .stock-text.out { color: #dc2626; }

    .var-section { margin-bottom: 16px; }
    .var-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 6px; }
    .var-label strong { color: var(--text); }
    .var-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .var-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1.5px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text); }
    .var-btn.active { border-color: var(--navy); background: #f8fafc; }
    .color-swatch { width: 16px; height: 14px; border-radius: 3px; border: 1px solid #cbd5e1; }

    .action-stack { display: flex; flex-direction: column; gap: 9px; margin-bottom: 10px; }
    .btn-navy { width: 100%; background: var(--navy); color: #fff; border: none; height: 46px; border-radius: 10px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: opacity 0.15s; }
    .btn-navy:active { opacity: 0.9; }
    .btn-orange { background: var(--orange); }
    .btn-outline { width: 100%; background: #fff; color: var(--navy); border: 1.5px solid var(--border); height: 44px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-outline:hover { border-color: var(--navy); }

    /* Centered Section Cards with Dual Underline Dividers */
    .section-card { border-top: 6px solid #f1f5f9; padding: 22px 16px; }
    .section-heading {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 16px; text-align: center;
    }
    .section-heading::before, .section-heading::after {
      content: ""; height: 1.5px; flex: 1; max-width: 56px;
      background: linear-gradient(90deg, transparent, #cbd5e1);
    }
    .section-heading::after {
      background: linear-gradient(90deg, #cbd5e1, transparent);
    }
    .desc-content {
      font-size: 14px; line-height: 1.8; white-space: pre-line; color: #334155;
      text-align: center; max-width: 720px; margin: 0 auto;
    }

    .rev-overview { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; background: #f8fafc; padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #f1f5f9; }
    .rev-big-score { font-size: 30px; font-weight: 800; color: var(--navy); line-height: 1; }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; color: var(--muted); }
    .bar-track { flex: 1; height: 6px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--navy); border-radius: 99px; }
    .rev-item { border-bottom: 1px solid #f1f5f9; padding: 10px 0; }
    .rev-item:last-child { border-bottom: none; }

    .rel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 768px) { .rel-grid { grid-template-columns: repeat(4, 1fr); } }
    .rel-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: #fff; text-align: center; }
    .rel-card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; }
    .rel-card h4 { font-size: 13px; margin: 6px 0 4px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Dedicated Order Checkout View */
    .checkout-page-wrap { max-width: 640px; margin: 0 auto; padding: 14px; animation: fadeIn 0.22s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .checkout-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 12px; }
    .checkout-card h3 { font-size: 15px; color: var(--navy); margin-bottom: 12px; }
    .form-group { margin-bottom: 11px; }
    .form-group label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff; outline: none; }
    .form-control:focus { border-color: var(--navy); }

    .pay-option-card {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; cursor: pointer;
    }
    .pay-option-card.active { border-color: var(--navy); background: #f8fafc; }
    .pay-option-left { display: flex; align-items: center; gap: 10px; }
    .pay-option-left input { width: 17px; height: 17px; accent-color: var(--navy); }
    .pay-option-title { font-size: 13.5px; font-weight: 700; color: var(--navy); }
    .pay-option-sub { font-size: 11.5px; color: var(--muted); }
    .pay-option-amt { font-size: 13.5px; font-weight: 800; color: var(--navy); white-space: nowrap; }

    .gw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 8px; }
    .gw-card { border: 1.5px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; text-align: center; background: #fff; }
    .gw-card.active { border-color: var(--navy); background: #f8fafc; }
    .gw-badge { font-size: 14px; font-weight: 800; display: block; margin-bottom: 2px; }
    .gw-bkash { color: #e2136e; } .gw-nagad { color: #f7941d; } .gw-rocket { color: #8c3494; }

    .summary-line { display: flex; justify-content: space-between; font-size: 13.5px; padding: 4px 0; color: #475569; }
    .summary-total { display: flex; justify-content: space-between; font-size: 16.5px; font-weight: 800; color: var(--navy); border-top: 1px dashed #cbd5e1; padding-top: 10px; margin-top: 8px; }

    /* Confirmation Animation */
    .confirm-wrap { max-width: 500px; margin: 24px auto; padding: 26px 18px; text-align: center; background: #fff; border-radius: 18px; border: 1px solid var(--border); animation: popIn 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    .check-anim { width: 74px; height: 74px; margin: 0 auto 14px; display: block; }
    .check-circle { stroke: #16a34a; stroke-width: 3; fill: #dcfce7; stroke-dasharray: 220; stroke-dashoffset: 220; animation: drawCircle 0.55s ease forwards; }
    .check-mark { stroke: #16a34a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-dasharray: 60; stroke-dashoffset: 60; animation: drawCheck 0.35s 0.4s ease forwards; }
    @keyframes drawCircle { to { stroke-dashoffset: 0; } }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    /* Flush Footer (Zero Gap with 60px Bottom Nav) */
    .site-footer {
      background: linear-gradient(180deg, #102145 0%, #0a152e 100%);
      color: #cbd5e1; padding: 26px 18px 20px; border-top: 2px solid var(--orange); margin-top: auto;
    }
    .footer-inner { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; }
    .footer-copy { max-width: 980px; margin: 14px auto 0; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #64748b; text-align: center; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.92); z-index: 500; align-items: center; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal img { max-width: 100%; max-height: 92vh; object-fit: contain; }
    .modal-close { position: fixed; top: 16px; right: 16px; background: #fff; color: #0f172a; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 20px; cursor: pointer; }
    .rev-modal-box { background: #fff; padding: 20px; border-radius: 14px; width: 100%; max-width: 400px; }

    /* Flush 60px Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--navy); border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-around; align-items: center; z-index: 150; }
    @media (min-width: 992px) { .bottom-nav { display: none; } }
    .bnav-item { display: flex; flex-direction: column; align-items: center; color: #fff; font-size: 10px; font-weight: 700; gap: 4px; position: relative; }
    .bnav-item svg { width: 20px; height: 20px; stroke: var(--orange); stroke-width: 2; }
    .bnav-badge { position: absolute; top: -6px; right: -8px; background: var(--orange); color: #fff; font-size: 9.5px; min-width: 16px; height: 16px; border-radius: 99px; display: flex; align-items: center; justify-content: center; }

    @keyframes cartBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.38); }
      65% { transform: scale(0.88); }
      100% { transform: scale(1); }
    }
    .cart-bounce { animation: cartBounce 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
    .fly-img {
      position: fixed; z-index: 999; width: 52px; height: 52px; object-fit: contain;
      border-radius: 12px; border: 1.5px solid var(--orange); background: #fff;
      pointer-events: none; transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
    }
    .btn-added-anim {
      background: #16a34a !important; color: #fff !important;
      border-color: #16a34a !important; transform: scale(0.98);
      transition: all 0.2s ease;
    }

    .toast {
      position: fixed; bottom: 74px; left: 50%;
      transform: translateX(-50%) translateY(16px) scale(0.94);
      background: var(--navy-deep); color: #fff; padding: 10px 16px; border-radius: 99px;
      font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1); z-index: 300;
      white-space: nowrap; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 26px rgba(12, 26, 54, 0.28);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
  </style>
</head>
<body>

  <div class="top-progress" id="topProgress"></div>

  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <button class="icon-btn" id="headerBackBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <a href="checkout.html?mode=cart" class="icon-btn" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg>
          <span class="cart-badge" id="topCartCount">0</span>
        </a>
      </div>
      <a href="index.html" class="brand-logo">
        <div class="logo-circle">
          <img class="brand-logo-img" src="https://gcdnb.pbrd.co/images/X64gpxh4sBU_.jpg" alt="TH Sports" />
        </div>
        <div class="brand-text-col">
          <span class="brand-title">TH SPORTS</span>
          <span class="brand-sub">BANGLADESH</span>
        </div>
      </a>
    </div>
  </header>

  <main class="container" id="mainContainer">
    <!-- Clean Skeleton Shimmer Loader -->
    <div class="skel-wrap">
      <div class="skel-box" style="height:52px;"></div>
      <div class="skel-box" style="height:290px;"></div>
      <div class="skel-box" style="height:32px;width:45%;"></div>
      <div class="skel-box" style="height:46px;"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="logo-circle" style="width:36px;height:36px;"><img class="brand-logo-img" src="https://gcdnb.pbrd.co/images/X64gpxh4sBU_.jpg" alt="TH" /></div>
        <div><strong style="color:#fff;font-style:italic;font-size:15px;">TH SPORTS</strong><span style="display:block;font-size:11px;color:#94a3b8;">Authentic Sports Gear</span></div>
      </div>
      <div style="display:flex;gap:16px;font-size:13px;color:#94a3b8;">
        <a href="index.html">Home</a>
        <a href="checkout.html?mode=cart">Cart</a>
      </div>
    </div>
    <div class="footer-copy">© 2026 TH Sports (thsports.shop). All rights reserved.</div>
  </footer>

  <div class="modal" id="zoomModal">
    <button class="modal-close" id="closeZoomBtn">×</button>
    <img id="zoomImg" src="" alt="Zoom" />
  </div>

  <div class="modal" id="reviewModal" style="background:rgba(15,23,42,0.6);">
    <div class="rev-modal-box">
      <h3 style="margin-bottom:14px;color:var(--navy);font-size:16px;">রিভিউ দিন</h3>
      <div class="form-group"><label>আপনার নাম</label><input type="text" id="revName" class="form-control" /></div>
      <div class="form-group">
        <label>রেটিং</label>
        <select id="revRating" class="form-control">
          <option value="5">★★★★★ (৫)</option><option value="4">★★★★☆ (৪)</option>
          <option value="3">★★★☆☆ (৩)</option><option value="2">★★☆☆☆ (২)</option><option value="1">★☆☆☆☆ (১)</option>
        </select>
      </div>
      <div class="form-group"><label>মতামত</label><textarea id="revComment" class="form-control" rows="3"></textarea></div>
      <div style="display:flex;gap:8px;">
        <button class="btn-navy" id="submitReviewBtn" style="height:42px;">সাবমিট</button>
        <button class="btn-outline" style="height:42px;" id="cancelRevBtn">বাতিল</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
      <span>HOME</span>
    </a>
    <a href="checkout.html?mode=cart" class="bnav-item">
      <div style="position:relative;display:inline-flex;">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg>
        <span class="bnav-badge" id="bottomCartCount">0</span>
      </div>
      <span>CART</span>
    </a>
    <a href="index.html" class="bnav-item">

    let toastTimer = null;

    function extractYoutubeId(url) {
      const m = String(url || "").match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    async function generateNextOrderCode() {
      try {
        const counterRef = doc(db, "counters", "orders");
        const nextSeq = await runTransaction(db, async (tx) => {
          const snap = await tx.get(counterRef);
          const next = snap.exists() ? Number(snap.data().seq || 0) + 1 : 1;
          tx.set(counterRef, { seq: next });
          return next;
        });
        return { orderSeq: nextSeq, orderCode: "TH" + String(nextSeq).padStart(2, "0") };
      } catch (e) {
        const fallback = Math.floor(100 + Math.random() * 900);
        return { orderSeq: fallback, orderCode: "TH" + fallback };
      }
    }

    async function loadSettings() {
      try {

          const d = s.data();

            ...storeSettings, ...d,
            ishwardiCharge: d.ishwardiCharge ?? d.insideDhaka ?? 60,
            outsideIshwardiCharge: d.outsideIshwardiCharge ?? d.outsideDhaka ?? 120,
            gateways: { ...storeSettings.gateways, ...(d.gateways || {}) }

          if (storeSettings.logoUrl) {
            document.querySelectorAll(".brand-logo-img").forEach(img => img.src = storeSettings.logoUrl);

    function finishProgress() {
      prog.style.width = "100%";
      setTimeout(() => prog.style.opacity = "0", 280);
    }

    async function init() {
      updateCartBadge();
      await loadSettings();

      if (mode === "cart" || !productId) {
        finishProgress();

      currentProduct = { id: snap.id, ...snap.data() };
      const imgs = [currentProduct.mainImage, ...(currentProduct.gallery || [])].filter(Boolean);
      const vids = (currentProduct.videoUrls || []).filter(Boolean);
      mediaItems = [
        ...imgs.map(u => ({ type: "image", url: u })),
        ...vids.map(u => ({ type: "video", url: u, ytId: extractYoutubeId(u) }))

      if (!mediaItems.length) mediaItems = [{ type: "image", url: "https://placehold.co/500x500/f8fafc/162d59?text=TH+SPORTS" }];
      selectedVariant = (currentProduct.variants && currentProduct.variants.length) ? currentProduct.variants[0] : null;

      if (stepParam === "order") {
        openSingleProductCheckoutView(1, false);
      } else {
        renderProductPage();
        loadReviews();
        loadRelatedProducts();
      }
    }

    function renderProductPage() {
      inCheckoutView = false;
      const p = currentProduct;
      const activePrice = selectedVariant ? Number(selectedVariant.price || p.offerPrice || p.regularPrice) : Number(p.offerPrice || p.regularPrice);
      const regPrice = Number(p.regularPrice || activePrice);
      const activeStock = selectedVariant ? Number(selectedVariant.stock ?? p.stock ?? 0) : Number(p.stock ?? 0);
      const ratingCount = Number(p.reviewCount || 0), avgRating = Number(p.avgRating || 5);
      const starsHtml = "★".repeat(Math.round(avgRating)) + "☆".repeat(5 - Math.round(avgRating));

      const renderActiveMedia = (idx) => {
        const m = mediaItems[idx];
        if (m.type === "video") {
          return m.ytId
            ? `<iframe src="https://www.youtube.com/embed/${esc(m.ytId)}?rel=0" allowfullscreen></iframe>`
            : `<video src="${esc(m.url)}" controls playsinline></video>`;
        }
        return `
          <div class="zoom-stage" id="zoomStage">
            <img id="mainGalleryImg" src="${esc(m.url)}" alt="${esc(p.name)}" />
          </div>
          <button class="expand-btn" id="openFullModalBtn" aria-label="Fullscreen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          </button>
        `;
      };

      document.getElementById("mainContainer").innerHTML = `
        <div class="top-intro">
          <div class="breadcrumb"><a href="index.html">হোম</a> <span>&gt;</span> <span>${esc(p.name)}</span></div>
          <h1 class="prod-main-title">${esc(p.name)}</h1>
        </div>

        <div class="showcase-wrap">
          <div class="gallery-card" id="galleryDisplayBox">
            <div id="activeMediaWrap" style="width:100%;display:flex;justify-content:center;position:relative;">${renderActiveMedia(0)}</div>
            ${mediaItems.length > 1 ? `
              <button class="gal-arrow gal-prev" id="prevImg"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
              <button class="gal-arrow gal-next" id="nextImg"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
            ` : ''}
          </div>
        </div>

        <div class="thumb-strip">
          ${mediaItems.map((m, i) => {
            if (m.type === "video") {
              const tImg = m.ytId ? `https://img.youtube.com/vi/${m.ytId}/hqdefault.jpg` : "";
              return `<div class="thumb-item ${i===0?'active':''}" data-idx="${i}">
                ${tImg ? `<img src="${esc(tImg)}" alt="">` : `<span style="font-size:10px;font-weight:700;color:var(--navy);">VIDEO</span>`}
                <div class="thumb-vid-badge">▶</div>
              </div>`;
            }
            return `<div class="thumb-item ${i===0?'active':''}" data-idx="${i}"><img src="${esc(m.url)}" alt=""></div>`;
          }).join("")}
        </div>

        <div class="details-body">
          <div class="rating-summary">
            <span class="stars">${starsHtml}</span>
            <span>${toBn(ratingCount)} রিভিউ</span>
            <span class="add-rev-link" id="openRevBtn">রিভিউ লিখুন</span>
          </div>

          <div class="price-row">
            <div class="price-pill" id="livePrice">${formatPrice(activePrice)}</div>
            ${regPrice > activePrice ? `<div class="reg-strike">${formatPrice(regPrice)}</div>` : ''}
          </div>

          <div class="stock-text ${activeStock <= 0 ? 'out' : ''}" id="liveStock">
            ${activeStock > 0 ? `স্টকে আছে (${toBn(activeStock)} টি)` : 'স্টক শেষ'}
          </div>

          ${(p.variants && p.variants.length) ? `
            <div class="var-section">
              <div class="var-label">ভেরিয়েন্ট: <strong id="varSelectedName">${esc(selectedVariant.name)}</strong></div>
              <div class="var-options">
                ${p.variants.map((v, idx) => `
                  <button class="var-btn ${idx===0?'active':''}" data-idx="${idx}">
                    ${v.color ? `<span class="color-swatch" style="background:${esc(v.color)};"></span>` : ''}
                    <span>${esc(v.name)}</span>
                  </button>
                `).join("")}
              </div>
            </div>
          ` : ''}

          <div class="action-stack">
            <button class="btn-navy btn-orange" id="goOrderNowBtn">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg>
              অর্ডার করুন
            </button>
            <button class="btn-outline" id="addToCartBtn">কার্টে যোগ করুন</button>
            <a href="https://wa.me/${esc(storeSettings.whatsapp)}?text=${encodeURIComponent('অর্ডার: ' + p.name)}" target="_blank" class="btn-navy">মেসেজ করুন</a>
          </div>

        <div class="section-card">
          <div class="section-heading">প্রোডাক্টের বিস্তারিত বিবরণ</div>
          <div class="desc-content">${esc(p.description || "বিস্তারিত তথ্য শীঘ্রই যুক্ত করা হবে।")}</div>
        </div>

        <div class="section-card">
          <div class="section-heading">কাস্টমার রিভিউ (${toBn(ratingCount)})</div>
          <div id="reviewsContainer"></div>
        </div>

        <div class="section-card">
          <div class="section-heading">সম্পর্কিত প্রোডাক্ট</div>
          <div class="rel-grid" id="relatedGrid"></div>
        </div>
      `;

      // Spot Click-to-Zoom & Pan Logic
      const bindSpotZoom = () => {
        const stage = document.getElementById("zoomStage");
        const img = document.getElementById("mainGalleryImg");
        if (!stage || !img) return;
        let zoomed = false;

        const updateOrigin = (clientX, clientY) => {
          const rect = stage.getBoundingClientRect();
          const xPct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
          const yPct = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
          img.style.transformOrigin = `${xPct}% ${yPct}%`;
        };

        stage.onclick = (e) => {
          zoomed = !zoomed;
          if (zoomed) {
            updateOrigin(e.clientX, e.clientY);
            stage.classList.add("is-zoomed");
            img.style.transform = "scale(2.25)";
          } else {
            stage.classList.remove("is-zoomed");
            img.style.transform = "scale(1)";
          }
        };

        stage.onmousemove = (e) => { if (zoomed) updateOrigin(e.clientX, e.clientY); };
        stage.ontouchmove = (e) => {
          if (zoomed && e.touches[0]) {
            e.preventDefault();
            updateOrigin(e.touches[0].clientX, e.touches[0].clientY);
          }
        };

        document.getElementById("openFullModalBtn")?.addEventListener("click", (e) => {
          e.stopPropagation();
          history.pushState({ zoom: true }, "");
          document.getElementById("zoomImg").src = mediaItems[currentMediaIdx].url;
          document.getElementById("zoomModal").classList.add("open");
        });
      };

      const setMedia = (idx) => {
        currentMediaIdx = (idx + mediaItems.length) % mediaItems.length;
        document.getElementById("activeMediaWrap").innerHTML = renderActiveMedia(currentMediaIdx);
        document.querySelectorAll(".thumb-item").forEach((t, i) => t.classList.toggle("active", i === currentMediaIdx));
        bindSpotZoom();
      };
      bindSpotZoom();

      document.getElementById("prevImg")?.addEventListener("click", () => setMedia(currentMediaIdx - 1));
      document.getElementById("nextImg")?.addEventListener("click", () => setMedia(currentMediaIdx + 1));
      document.querySelectorAll(".thumb-item").forEach(t => t.onclick = () => setMedia(Number(t.dataset.idx)));

      document.querySelectorAll(".var-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(".var-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          selectedVariant = p.variants[Number(btn.dataset.idx)];
          const vPrice = Number(selectedVariant.price || p.offerPrice || p.regularPrice);
          const vStock = Number(selectedVariant.stock ?? p.stock ?? 0);
          document.getElementById("varSelectedName").textContent = selectedVariant.name;
          document.getElementById("livePrice").textContent = formatPrice(vPrice);
          const stockEl = document.getElementById("liveStock");
          stockEl.textContent = vStock > 0 ? `স্টকে আছে (${toBn(vStock)} টি)` : "স্টক শেষ";
          stockEl.classList.toggle("out", vStock <= 0);
        };
      });

      document.getElementById("openRevBtn").onclick = () => {
        history.pushState({ rev: true }, "");
        document.getElementById("reviewModal").classList.add("open");
      };

      document.getElementById("addToCartBtn").onclick = () => {
        const btn = document.getElementById("addToCartBtn");
        const cart = JSON.parse(localStorage.getItem("th_cart") || "[]");
        const price = selectedVariant ? Number(selectedVariant.price || p.offerPrice || p.regularPrice) : Number(p.offerPrice || p.regularPrice);
        const varName = selectedVariant ? selectedVariant.name : "";
        const mainImg = (mediaItems.find(m => m.type === "image") || {}).url || "";
        const exist = cart.find(c => c.id === p.id && c.variant === varName);
        if (exist) exist.qty += 1;
        else cart.push({ id: p.id, name: p.name, price, image: mainImg, variant: varName, qty: 1, paymentRules: p.paymentRules || null });
        localStorage.setItem("th_cart", JSON.stringify(cart));
        updateCartBadge();

        // Flying Thumbnail Animation to Cart Icon
        const targetCart = document.getElementById("topCartCount").parentElement;
        const btnRect = btn.getBoundingClientRect();
        const cartRect = targetCart.getBoundingClientRect();
        if (mainImg) {
          const flyer = document.createElement("img");
          flyer.src = mainImg;
          flyer.className = "fly-img";
          flyer.style.left = (btnRect.left + btnRect.width / 2 - 26) + "px";
          flyer.style.top = (btnRect.top - 10) + "px";
          document.body.appendChild(flyer);
          requestAnimationFrame(() => {
            flyer.style.left = (cartRect.left + cartRect.width / 2 - 12) + "px";
            flyer.style.top = (cartRect.top + cartRect.height / 2 - 12) + "px";
            flyer.style.width = "22px";
            flyer.style.height = "22px";
            flyer.style.opacity = "0.2";
          });
          setTimeout(() => flyer.remove(), 620);
        }

        // Bounce Cart Icons + Button Feedback
        [document.getElementById("topCartCount").parentElement, document.getElementById("bottomCartCount").parentElement].forEach(el => {
          el.classList.remove("cart-bounce");
          void el.offsetWidth;
          el.classList.add("cart-bounce");
        });

        btn.classList.add("btn-added-anim");
        btn.textContent = "✓ কার্টে যোগ হয়েছে";
        setTimeout(() => {
          btn.classList.remove("btn-added-anim");
          btn.textContent = "কার্টে যোগ করুন";
        }, 1400);

        showToast("✓ কার্টে যোগ হয়েছে", true);
      };

      document.getElementById("goOrderNowBtn").onclick = () => openSingleProductCheckoutView(1, true);
    }

    function buildPaymentPlans(items, subtotal, deliveryCharge) {
      const total = subtotal + deliveryCharge;
      let allowCOD = true, allowAdvDel = false, allowFixedAdv = false, fixedAmount = 0, allowFull = false, note = "";

      if (items.length === 1 && items[0].paymentRules) {
        const r = items[0].paymentRules;
        allowCOD = r.allowCOD !== false;
        allowAdvDel = !!r.allowAdvanceDelivery;
        allowFixedAdv = !!r.allowFixedAdvance && Number(r.fixedAdvanceAmount) > 0;
        fixedAmount = Number(r.fixedAdvanceAmount || 0);
        allowFull = !!r.allowFullPayment;
        note = r.paymentNote || "";
      } else if (items.length > 1) {
        allowCOD = items.every(i => !i.paymentRules || i.paymentRules.allowCOD !== false);
        allowAdvDel = items.some(i => i.paymentRules?.allowAdvanceDelivery);
        allowFixedAdv = items.some(i => i.paymentRules?.allowFixedAdvance && Number(i.paymentRules?.fixedAdvanceAmount) > 0);
        fixedAmount = items.reduce((mx, i) => Math.max(mx, Number(i.paymentRules?.fixedAdvanceAmount || 0)), 0);
        allowFull = items.some(i => i.paymentRules?.allowFullPayment);
      }

      const plans = [];
      if (allowCOD) plans.push({ id: "cod", title: "Cash on Delivery", sub: "পণ্য হাতে পেয়ে সম্পূর্ণ টাকা পরিশোধ", payNow: 0, due: total, isOnline: false });
      if (allowAdvDel) plans.push({ id: "advance_delivery", title: "ডেলিভারি চার্জ অ্যাডভান্স", sub: "ডেলিভারি চার্জ অগ্রিম, বাকি টাকা পণ্যের সাথে", payNow: deliveryCharge, due: subtotal, isOnline: true });
      if (allowFixedAdv && fixedAmount > 0) {
        const adv = Math.min(total, fixedAmount);
        plans.push({ id: "fixed_advance", title: `অ্যাডভান্স পেমেন্ট (${formatPrice(adv)})`, sub: "অগ্রিম পরিশোধ, বাকি টাকা কুরিয়ারে", payNow: adv, due: total - adv, isOnline: true });
      }
      if (allowFull) plans.push({ id: "full", title: "সম্পূর্ণ পেমেন্ট", sub: "পুরো বিল অগ্রিম পরিশোধ", payNow: total, due: 0, isOnline: true });
      if (!plans.length) plans.push({ id: "advance_delivery", title: "ডেলিভারি চার্জ অ্যাডভান্স", sub: "ডেলিভারি চার্জ অগ্রিম পরিশোধ", payNow: deliveryCharge, due: subtotal, isOnline: true });
      return { plans, note };
    }

    function openSingleProductCheckoutView(initialQty = 1, pushHist = true) {
      inCheckoutView = true;
      if (pushHist) history.pushState({ step: "order" }, "");
      const p = currentProduct;
      const price = selectedVariant ? Number(selectedVariant.price || p.offerPrice || p.regularPrice) : Number(p.offerPrice || p.regularPrice);
      const mainImg = (mediaItems.find(m => m.type === "image") || {}).url || "";

      renderUnifiedCheckout({
        isCart: false,
        items: [{ productId: p.id, name: p.name, variant: selectedVariant ? selectedVariant.name : "", price, qty: initialQty, image: mainImg, paymentRules: p.paymentRules || null }]
      });
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function renderCartCheckout() {
      const cart = JSON.parse(localStorage.getItem("th_cart") || "[]");
      if (!cart.length) {
        document.getElementById("mainContainer").innerHTML = `<div style="padding:70px 20px;text-align:center;"><h3 style="color:var(--navy);">আপনার শপিং কার্ট খালি</h3><a href="index.html" class="btn-navy" style="max-width:220px;margin:18px auto;">শপিং করুন</a></div>`;
        return;
      }
      renderUnifiedCheckout({
        isCart: true,
        items: cart.map(c => ({ productId: c.id, name: c.name, variant: c.variant || "", price: c.price, qty: c.qty, image: c.image, paymentRules: c.paymentRules || null }))
      });
    }

    function renderUnifiedCheckout({ isCart, items }) {
      const container = document.getElementById("mainContainer");
      const enabledGateways = Object.entries(storeSettings.gateways || {}).filter(([, g]) => g && g.enabled && g.number);
      const getSubtotal = () => items.reduce((s, i) => s + Number(i.price) * Number(i.qty), 0);

      container.innerHTML = `
        <div class="checkout-page-wrap">
          <div class="checkout-card">
            <h3>অর্ডার আইটেম</h3>
            <div>
              ${items.map((it, idx) => `
                <div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;">
                  <img src="${esc(it.image || 'https://placehold.co/60')}" style="width:50px;height:50px;object-fit:contain;border-radius:8px;border:1px solid var(--border);" />
                  <div style="flex:1;">
                    <div style="font-size:13.5px;font-weight:700;">${esc(it.name)}</div>
                    ${it.variant ? `<div style="font-size:11.5px;color:var(--muted);">${esc(it.variant)}</div>` : ''}
                    <div style="font-size:13px;font-weight:700;color:var(--navy);">${formatPrice(it.price)} × ${toBn(it.qty)}</div>
                  </div>
                  ${isCart ? `<button class="icon-btn" onclick="removeCartIdx(${idx})" style="color:#64748b;font-size:16px;">✕</button>` : `
                    <div style="display:flex;align-items:center;gap:6px;">
                      <button type="button" id="qtyDecBtn" style="width:28px;height:28px;border:1px solid var(--border);background:#fff;border-radius:6px;font-weight:700;">-</button>
                      <span id="qtyShow" style="font-weight:700;min-width:18px;text-align:center;">${toBn(it.qty)}</span>
                      <button type="button" id="qtyIncBtn" style="width:28px;height:28px;border:1px solid var(--border);background:#fff;border-radius:6px;font-weight:700;">+</button>
                    </div>
                  `}
                </div>
              `).join("")}
            </div>
          </div>

          <div class="checkout-card">
            <h3>ডেলিভারি তথ্য</h3>
            <div class="form-group"><label>নাম *</label><input type="text" id="ckName" class="form-control" placeholder="আপনার নাম" /></div>
            <div class="form-group"><label>মোবাইল নম্বর *</label><input type="tel" id="ckPhone" class="form-control" placeholder="01XXXXXXXXX" /></div>
            <div class="form-group"><label>ঠিকানা *</label><textarea id="ckAddress" class="form-control" rows="2" placeholder="বাড়ি/গ্রাম, থানা, জেলা"></textarea></div>
            <div class="form-group" style="margin-bottom:0;">
              <label>ডেলিভারি এলাকা *</label>
              <select id="ckDeliveryZone" class="form-control">
                <option value="ishwardi">ঈশ্বরদীর ভেতরে (${formatPrice(storeSettings.ishwardiCharge)})</option>
                <option value="outside">সারাদেশ বাংলাদেশ (${formatPrice(storeSettings.outsideIshwardiCharge)})</option>
              </select>
            </div>
          </div>

          <div class="checkout-card">
            <h3>পেমেন্ট মেথড</h3>
            <div id="ckPaymentNoteBox" style="display:none;background:#f8fafc;border:1px solid var(--border);color:var(--navy);font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:10px;font-weight:600;"></div>
            <div id="ckPlanList"></div>

            <div id="ckGatewaySection" style="display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);">
              <label style="display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px;">পেমেন্ট মাধ্যম:</label>
              <div class="gw-grid" id="ckGatewayGrid">
                ${enabledGateways.length ? enabledGateways.map(([key, g], i) => `
                  <div class="gw-card ${i===0?'active':''}" data-gw="${key}">
                    <span class="gw-badge gw-${key}">${key === 'bkash' ? 'bKash' : key === 'nagad' ? 'Nagad' : 'Rocket'}</span>
                    <small style="display:block;font-size:11px;color:var(--muted);">${esc(g.type)}</small>
                    <small style="display:block;font-size:10.5px;color:var(--navy);margin-top:2px;">${esc(g.instruction)}</small>
                  </div>
                `).join("") : `<p style="font-size:12px;color:#dc2626;">কোনো পেমেন্ট গেটওয়ে চালু নেই।</p>`}
              </div>
            </div>
          </div>

          <div class="checkout-card">
            <div class="summary-line"><span>সাবটোটাল:</span><strong id="sumSub"></strong></div>
            <div class="summary-line"><span>ডেলিভারি চার্জ:</span><strong id="sumDel"></strong></div>
            <div class="summary-total"><span>সর্বমোট বিল:</span><span id="sumTotal"></span></div>
            <div class="summary-line" style="color:var(--navy);margin-top:6px;"><span>অগ্রিম পেমেন্ট:</span><strong id="sumPayNow"></strong></div>
            <div class="summary-line" style="color:var(--muted);"><span>ডেলিভারিতে বাকি:</span><strong id="sumDue"></strong></div>
            <button class="btn-navy btn-orange" id="placeOrderBtn" style="margin-top:14px;">অর্ডার কনফার্ম করুন</button>
          </div>
        </div>
      `;

      let selectedPlanId = null;
      let selectedGateway = enabledGateways.length ? enabledGateways[0][0] : "";

      const getDeliveryCharge = () => document.getElementById("ckDeliveryZone").value === "ishwardi"
        ? Number(storeSettings.ishwardiCharge)
        : Number(storeSettings.outsideIshwardiCharge);

      const refreshCalculations = () => {
        const sub = getSubtotal();
        const del = getDeliveryCharge();
        const { plans, note } = buildPaymentPlans(items, sub, del);

        const noteEl = document.getElementById("ckPaymentNoteBox");
        if (note) { noteEl.textContent = note; noteEl.style.display = "block"; }
        else noteEl.style.display = "none";

        if (!selectedPlanId || !plans.some(pl => pl.id === selectedPlanId)) selectedPlanId = plans[0].id;
        const activePlan = plans.find(pl => pl.id === selectedPlanId);

        document.getElementById("ckPlanList").innerHTML = plans.map(pl => `
          <label class="pay-option-card ${pl.id === selectedPlanId ? 'active' : ''}">
            <div class="pay-option-left">
              <input type="radio" name="payPlan" value="${pl.id}" ${pl.id === selectedPlanId ? 'checked' : ''} />
              <div>
                <div class="pay-option-title">${esc(pl.title)}</div>
                <div class="pay-option-sub">${esc(pl.sub)}</div>
              </div>
            </div>
            <span class="pay-option-amt">${pl.payNow > 0 ? formatPrice(pl.payNow) : '০৳'}</span>
          </label>
        `).join("");

        document.querySelectorAll('input[name="payPlan"]').forEach(r => {
          r.onchange = () => { selectedPlanId = r.value; refreshCalculations(); };
        });

        document.getElementById("ckGatewaySection").style.display = activePlan.isOnline ? "block" : "none";
        document.getElementById("sumSub").textContent = formatPrice(sub);
        document.getElementById("sumDel").textContent = formatPrice(del);
        document.getElementById("sumTotal").textContent = formatPrice(sub + del);
        document.getElementById("sumPayNow").textContent = formatPrice(activePlan.payNow);
        document.getElementById("sumDue").textContent = formatPrice(activePlan.due);

        document.getElementById("placeOrderBtn").textContent = activePlan.isOnline
          ? `পেমেন্ট করুন (${formatPrice(activePlan.payNow)})`
          : "অর্ডার কনফার্ম করুন";
      };

      document.getElementById("ckGatewayGrid")?.addEventListener("click", (e) => {
        const card = e.target.closest(".gw-card"); if (!card) return;
        selectedGateway = card.dataset.gw;
        document.querySelectorAll(".gw-card").forEach(c => c.classList.toggle("active", c === card));
      });

      document.getElementById("ckDeliveryZone").onchange = refreshCalculations;

      if (!isCart) {
        document.getElementById("qtyIncBtn").onclick = () => { items[0].qty += 1; document.getElementById("qtyShow").textContent = toBn(items[0].qty); refreshCalculations(); };
        document.getElementById("qtyDecBtn").onclick = () => { if (items[0].qty > 1) { items[0].qty -= 1; document.getElementById("qtyShow").textContent = toBn(items[0].qty); refreshCalculations(); } };
      } else {
        window.removeCartIdx = (idx) => {
          const cart = JSON.parse(localStorage.getItem("th_cart") || "[]");
          cart.splice(idx, 1); localStorage.setItem("th_cart", JSON.stringify(cart));
          updateCartBadge(); renderCartCheckout();
        };
      }

      refreshCalculations();

      document.getElementById("placeOrderBtn").onclick = async () => {
        const customerName = document.getElementById("ckName").value.trim();
        const phone = document.getElementById("ckPhone").value.trim();
        const address = document.getElementById("ckAddress").value.trim();
        if (!customerName || !phone || !address) return showToast("নাম, ফোন এবং ঠিকানা দিন");

        const sub = getSubtotal(), del = getDeliveryCharge(), zone = document.getElementById("ckDeliveryZone").value;
        const { plans } = buildPaymentPlans(items, sub, del);
        const activePlan = plans.find(pl => pl.id === selectedPlanId);
        const cleanItems = items.map(i => ({ productId: i.productId, name: i.name, variant: i.variant || "", price: i.price, qty: i.qty, image: i.image || "" }));

        if (activePlan.isOnline) {
          if (!selectedGateway) return showToast("পেমেন্ট মাধ্যম সিলেক্ট করুন");
          sessionStorage.setItem("th_pending_order", JSON.stringify({
            isCart, customerName, phone, address, deliveryZone: zone,
            items: cleanItems, subtotal: sub, deliveryCharge: del, totalAmount: sub + del,
            paymentPlan: activePlan.id, payAmount: activePlan.payNow, dueAmount: activePlan.due,
            gateway: selectedGateway
          }));
          location.href = `paymentgetway.html?gw=${encodeURIComponent(selectedGateway)}&amount=${activePlan.payNow}`;
          return;
        }

        const btn = document.getElementById("placeOrderBtn");
        btn.disabled = true; btn.textContent = "অপেক্ষা করুন...";
        try {
          const { orderSeq, orderCode } = await generateNextOrderCode();
          await addDoc(collection(db, "orders"), {
            orderSeq, orderCode, customerName, phone, address, deliveryZone: zone,
            items: cleanItems, subtotal: sub, deliveryCharge: del, totalAmount: sub + del,
            paidAmount: 0, dueAmount: sub + del,
            paymentMethod: "COD", paymentPlan: "cod", paymentStatus: "Unpaid",
            status: "Pending", createdAt: Date.now()
          });
          if (isCart) { localStorage.removeItem("th_cart"); updateCartBadge(); }
          sessionStorage.setItem("th_confirmed_order", JSON.stringify({
            orderCode, customerName, totalAmount: sub + del, paidAmount: 0, dueAmount: sub + del, paymentMethod: "COD"
          }));
          location.href = "checkout.html?confirmed=1";
        } catch (err) {
          showToast("অর্ডার সাবমিট ব্যর্থ হয়েছে");
          btn.disabled = false; btn.textContent = "অর্ডার কনফার্ম করুন";
        }
      };
    }

    function renderOrderConfirmedScreen() {
      const info = JSON.parse(sessionStorage.getItem("th_confirmed_order") || "null") || {};
      document.getElementById("mainContainer").innerHTML = `
        <div class="confirm-wrap">
          <svg class="check-anim" viewBox="0 0 80 80">
            <circle class="check-circle" cx="40" cy="40" r="35" />
            <path class="check-mark" d="M24 41 L35 52 L57 29" />
          </svg>
          <h2 style="color:#16a34a;font-size:21px;margin-bottom:6px;">অর্ডার কনফার্ম হয়েছে!</h2>
          <p style="font-size:13.5px;color:var(--muted);margin-bottom:14px;">ধন্যবাদ ${esc(info.customerName || '')}, আপনার অর্ডারটি সফলভাবে গৃহীত হয়েছে।</p>
          <div style="background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:left;font-size:13.5px;line-height:1.85;margin-bottom:18px;">
            <div style="display:flex;justify-content:space-between;"><span>Order ID:</span><strong style="color:var(--navy);font-size:15px;">${esc(info.orderCode || 'TH01')}</strong></div>
            <div style="display:flex;justify-content:space-between;"><span>মোট বিল:</span><strong>${formatPrice(info.totalAmount || 0)}</strong></div>
            <div style="display:flex;justify-content:space-between;color:#16a34a;"><span>অ্যাডভান্স পেইড (${esc(info.paymentMethod || 'COD')}):</span><strong>${formatPrice(info.paidAmount || 0)}</strong></div>
            <div style="display:flex;justify-content:space-between;color:var(--navy);"><span>ডেলিভারিতে বাকি (COD):</span><strong>${formatPrice(info.dueAmount ?? info.totalAmount ?? 0)}</strong></div>
          </div>
          <a href="index.html" class="btn-navy">আরও শপিং করুন</a>
        </div>
      `;
    }

    async function loadReviews() {
      const snap = await getDocs(query(collection(db, "reviews"), where("productId", "==", productId)));
      const reviews = snap.docs.map(d => d.data()).sort((a,b) => b.createdAt - a.createdAt);
      const container = document.getElementById("reviewsContainer");
      if (!container) return;
      if (!reviews.length) { container.innerHTML = `<p style="color:var(--muted);font-size:13.5px;text-align:center;">এখনও কোনো রিভিউ নেই।</p>`; return; }
      const avg = (reviews.reduce((s, r) => s + Number(r.rating), 0) / reviews.length).toFixed(1);
      const counts = [5,4,3,2,1].map(st => ({ st, n: reviews.filter(r => Number(r.rating) === st).length }));
      container.innerHTML = `
        <div class="rev-overview">
          <div>
            <div class="rev-big-score">${avg}<span style="font-size:14px;color:var(--muted)">/5</span></div>
            <div class="stars">${"★".repeat(Math.round(avg))}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:3px;">${toBn(reviews.length)} রিভিউ</div>
          </div>
          <div>${counts.map(c => `<div class="bar-row"><span style="width:24px;">${c.st}★</span><div class="bar-track"><div class="bar-fill" style="width:${(c.n/reviews.length)*100}%"></div></div><span style="width:20px;text-align:right;">${toBn(c.n)}</span></div>`).join("")}</div>
        </div>
        ${reviews.map(r => `<div class="rev-item"><div style="display:flex;justify-content:space-between;font-weight:600;font-size:13px;"><span>${esc(r.userName)}</span><span class="stars" style="font-size:13px;">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span></div><p style="font-size:13px;margin-top:3px;color:#334155;">${esc(r.comment)}</p></div>`).join("")}
      `;
    }

    document.getElementById("submitReviewBtn").onclick = async () => {
      const userName = document.getElementById("revName").value.trim(), rating = Number(document.getElementById("revRating").value), comment = document.getElementById("revComment").value.trim();
      if (!userName || !comment) return showToast("নাম এবং মতামত লিখুন");
      await addDoc(collection(db, "reviews"), { productId, userName, rating, comment, createdAt: Date.now() });
      const snap = await getDocs(query(collection(db, "reviews"), where("productId", "==", productId)));
      const revs = snap.docs.map(d => d.data());
      const avg = revs.reduce((s, r) => s + Number(r.rating), 0) / revs.length;
      await updateDoc(doc(db, "products", productId), { reviewCount: revs.length, avgRating: Number(avg.toFixed(1)) });
      document.getElementById("reviewModal").classList.remove("open");
      document.getElementById("revName").value = ""; document.getElementById("revComment").value = "";
      showToast("রিভিউ যুক্ত হয়েছে ✓"); loadReviews();
    };
    document.getElementById("cancelRevBtn").onclick = () => document.getElementById("reviewModal").classList.remove("open");
    document.getElementById("closeZoomBtn").onclick = () => document.getElementById("zoomModal").classList.remove("open");

    async function loadRelatedProducts() {
      if (!currentProduct?.categoryId) return;
      const snap = await getDocs(query(collection(db, "products"), where("categoryId", "==", currentProduct.categoryId)));
      const rel = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.id !== productId).slice(0, 4);
      const grid = document.getElementById("relatedGrid");
      if (!grid) return;
      if (!rel.length) { grid.innerHTML = `<p style="grid-column:1/-1;color:var(--muted);font-size:13px;text-align:center;">সম্পর্কিত প্রোডাক্ট নেই।</p>`; return; }
      grid.innerHTML = rel.map(p => `<a href="checkout.html?id=${p.id}" class="rel-card"><img src="${esc(p.mainImage)}" alt=""><h4>${esc(p.name)}</h4><strong style="color:var(--navy);">${formatPrice(p.offerPrice || p.regularPrice)}</strong></a>`).join("");
    }

    init();
  </script>
</body>
</html>
