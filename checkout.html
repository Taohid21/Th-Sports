<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Checkout | TH Sports Bangladesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #162d59; --navy-deep: #0c1a36; --orange: #f04e23; --bg: #f5f7fb; --border: #e2e8f0; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif;
      background: #ffffff; color: var(--text); padding-bottom: 60px;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    @media (min-width: 992px) { body { padding-bottom: 0; } }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; }

    .header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.96); backdrop-filter: blur(12px); height: 60px; border-bottom: 1px solid var(--border); padding: 0 16px; }
    .header-inner { max-width: 1100px; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 18px; }
    .icon-btn { background: none; border: none; color: #1e293b; cursor: pointer; position: relative; display: inline-flex; }
    .icon-btn svg { width: 22px; height: 22px; stroke-width: 1.85; }
    .cart-badge {
      position: absolute; top: -4px; right: -7px; background: var(--orange); color: #fff;
      font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 99px;
      display: none; align-items: center; justify-content: center; border: 1.5px solid #fff;
    }
    .cart-badge.show { display: flex; }

    .brand-logo { display: flex; align-items: center; gap: 9px; }
    .logo-circle {
      width: 38px; height: 38px; border-radius: 50%; overflow: hidden;
      border: 1.8px solid var(--orange); background: var(--navy);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .logo-mono { color: #fff; font-size: 13px; font-weight: 800; }
    .brand-text-col { display: flex; flex-direction: column; line-height: 1; }
    .brand-title { font-size: 19px; font-weight: 800; font-style: italic; letter-spacing: -0.5px; color: var(--navy); }
    .brand-sub { font-size: 8px; font-weight: 700; letter-spacing: 3px; color: var(--orange); text-align: right; margin-top: 2px; }

    .container { max-width: 1000px; width: 100%; margin: 0 auto; flex: 1; }
    .top-intro { background: #f6f8fc; padding: 14px 16px 18px; }
    .breadcrumb { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .prod-main-title { font-size: 18px; font-weight: 700; color: var(--navy); line-height: 1.35; }

    .showcase-wrap { padding: 16px 14px 10px; background: #fff; }
    .gallery-card {
      position: relative; width: 100%; background: #fff;
      border: 1.5px solid rgba(240, 78, 35, 0.75); border-radius: 16px;
      padding: 12px; cursor: zoom-in; overflow: hidden; animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    .gallery-card img { width: 100%; max-height: 410px; object-fit: contain; display: block; margin: 0 auto; }
    .gal-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.92);
      border: none; width: 34px; height: 34px; border-radius: 50%; color: var(--orange);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .gal-prev { left: 8px; } .gal-next { right: 8px; }

    .thumb-strip { display: flex; gap: 10px; padding: 12px 14px; overflow-x: auto; }
    .thumb-item { width: 68px; height: 68px; flex-shrink: 0; border-radius: 12px; border: 1.5px solid var(--border); overflow: hidden; cursor: pointer; background: #fff; padding: 4px; }
    .thumb-item.active { border-color: var(--orange); }
    .thumb-item img { width: 100%; height: 100%; object-fit: contain; }

    .details-body { padding: 6px 16px 20px; }
    .rating-summary { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; }
    .stars { color: var(--orange); font-size: 16px; letter-spacing: 1px; }
    .add-rev-link { color: #1d4ed8; text-decoration: underline; cursor: pointer; font-weight: 500; }

    .price-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .price-pill { background: var(--orange); color: #fff; font-size: 24px; font-weight: 700; padding: 6px 16px; border-radius: 8px; }
    .reg-strike { font-size: 17px; color: #334155; text-decoration: line-through; text-decoration-color: #ef4444; text-decoration-thickness: 1.8px; }

    .stock-text { font-size: 14.5px; font-weight: 600; color: #1e293b; margin-bottom: 16px; }
    .stock-text.out { color: #dc2626; }

    .var-section { margin-bottom: 18px; }
    .var-label { font-size: 14px; color: var(--muted); margin-bottom: 10px; display: flex; gap: 10px; }
    .var-label strong { color: var(--text); }
    .var-options { display: flex; flex-wrap: wrap; gap: 10px; }
    .var-btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1.5px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13.5px; font-weight: 600; }
    .var-btn.active { border-color: var(--navy); box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--navy); }
    .color-swatch { width: 20px; height: 16px; border-radius: 3px; border: 1px solid #cbd5e1; }

    .action-stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
    .btn-navy { width: 100%; background: var(--navy); color: #fff; border: none; height: 48px; border-radius: 8px; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: background 0.15s; }
    .btn-navy:hover { background: var(--navy-deep); }
    .btn-outline { width: 100%; background: #fff; color: var(--navy); border: 1.5px solid var(--navy); height: 44px; border-radius: 8px; font-size: 14.5px; font-weight: 700; cursor: pointer; }

    .checkout-box { background: #f8fafc; border: 1.5px solid var(--border); border-radius: 14px; padding: 18px; margin: 16px 0 24px; }
    .checkout-box h3 { font-size: 17px; color: var(--navy); margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff; outline: none; }
    .form-control:focus { border-color: var(--navy); }
    .summary-line { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; color: #334155; }
    .summary-total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 700; color: var(--navy); border-top: 1.5px dashed #cbd5e1; padding-top: 10px; margin-top: 8px; }

    .section-card { border-top: 8px solid #f1f5f9; padding: 20px 16px; }
    .section-heading { font-size: 17px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
    .desc-content { font-size: 14.5px; line-height: 1.75; white-space: pre-line; color: #334155; }

    .rev-overview { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; background: #f8fafc; padding: 14px; border-radius: 12px; margin-bottom: 14px; }
    .rev-big-score { font-size: 34px; font-weight: 800; color: var(--navy); line-height: 1; }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; color: var(--muted); }
    .bar-track { flex: 1; height: 7px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--orange); border-radius: 99px; }
    .rev-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .rev-item:last-child { border-bottom: none; }
    .rev-author { font-weight: 600; font-size: 13.5px; display: flex; justify-content: space-between; }

    .rel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 768px) { .rel-grid { grid-template-columns: repeat(4, 1fr); } }
    .rel-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: #fff; }
    .rel-card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; }
    .rel-card h4 { font-size: 13px; margin: 6px 0 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Modern English Footer (Zero Gap) */
    .site-footer { background: linear-gradient(180deg, #102145 0%, #0a152e 100%); color: #cbd5e1; padding: 30px 18px 22px; border-top: 2px solid var(--orange); margin-top: auto; }
    .footer-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 18px; }
    .footer-brand { display: flex; align-items: center; gap: 10px; }
    .footer-links { display: flex; gap: 18px; font-size: 13px; color: #94a3b8; }
    .footer-links a:hover { color: #fff; }
    .footer-copy { max-width: 1000px; margin: 18px auto 0; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #64748b; text-align: center; }

    /* Modals */
    .modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.92); z-index: 500; align-items: center; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal img { max-width: 100%; max-height: 92vh; object-fit: contain; animation: fadeIn 0.2s ease; }
    .modal-close { position: fixed; top: 16px; right: 16px; background: #fff; color: #0f172a; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 20px; cursor: pointer; }
    .rev-modal-box { background: #fff; padding: 22px; border-radius: 14px; width: 100%; max-width: 420px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--navy); display: flex; justify-content: space-around; align-items: center; z-index: 150; }
    @media (min-width: 992px) { .bottom-nav { display: none; } }
    .bnav-item { display: flex; flex-direction: column; align-items: center; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; gap: 4px; position: relative; }
    .bnav-item svg { width: 20px; height: 20px; stroke: var(--orange); stroke-width: 2; }
    .bnav-badge { position: absolute; top: -6px; right: -8px; background: var(--orange); color: #fff; font-size: 9.5px; min-width: 16px; height: 16px; border-radius: 99px; display: flex; align-items: center; justify-content: center; }

    .toast { position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--navy-deep); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 300; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <a href="index.html" class="icon-btn" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

  <main class="container" id="mainContainer">

  <footer class="site-footer">

  </footer>

  <div class="modal" id="zoomModal">
    <button class="modal-close" onclick="document.getElementById('zoomModal').classList.remove('open')">×</button>
    <img id="zoomImg" src="" alt="Zoom" />
  </div>

  <div class="modal" id="reviewModal" style="background:rgba(15,23,42,0.6);">
    <div class="rev-modal-box">
      <h3 style="margin-bottom:14px;color:var(--navy);">আপনার রিভিউ লিখুন</h3>
      <div class="form-group"><label>আপনার নাম</label><input type="text" id="revName" class="form-control" placeholder="নাম লিখুন" /></div>
      <div class="form-group">
        <label>রেটিং</label>
        <select id="revRating" class="form-control">
          <option value="5">★★★★★ (৫ স্টার)</option><option value="4">★★★★☆ (৪ স্টার)</option>
          <option value="3">★★★☆☆ (৩ স্টার)</option><option value="2">★★☆☆☆ (২ স্টার)</option><option value="1">★☆☆☆☆ (১ স্টার)</option>
        </select>
      </div>
      <div class="form-group"><label>মতামত</label><textarea id="revComment" class="form-control" rows="3" placeholder="প্রোডাক্টটি কেমন ছিল লিখুন..."></textarea></div>
      <div style="display:flex;gap:8px;">
        <button class="btn-navy" id="submitReviewBtn" style="height:42px;">সাবমিট</button>
        <button class="btn-outline" style="height:42px;" onclick="document.getElementById('reviewModal').classList.remove('open')">বাতিল</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
      <span>HOME</span>
    </a>
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span>MENU</span>
    </a>
    <a href="checkout.html?mode=cart" class="bnav-item">
      <div style="position:relative;display:inline-flex;">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg>
        <span class="bnav-badge" id="bottomCartCount">0</span>
      </div>
      <span>CART</span>
    </a>
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 10-12h-7V2z"/></svg>
      <span>DEALS</span>
    </a>
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>SEARCH</span>
    </a>
  </nav>

  <div class="toast" id="toastBox"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs, addDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7qQLrHIDOOxxSUcDsjR5EcHO4-0mByNQ",
      authDomain: "th-sports-afd52.firebaseapp.com",
      projectId: "th-sports-afd52",
      storageBucket: "th-sports-afd52.firebasestorage.app",
      messagingSenderId: "479595748038",
      appId: "1:479595748038:web:0a0f2389d2b9f13aa215c7",
      measurementId: "G-H8L744Y578"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const params = new URLSearchParams(location.search);
    const productId = params.get("id"), mode = params.get("mode");

    const toBn = (n) => String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
    const formatPrice = (n) => toBn(Number(n || 0).toLocaleString("en-US")) + "৳";
    const esc = (s) => String(s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function showToast(msg) { const t = document.getElementById("toastBox"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }

    let storeSettings = { whatsapp: "8801700000000", insideDhaka: 60, outsideDhaka: 120, logoUrl: "" };
    let currentProduct = null, selectedVariant = null, galleryImages = [], currentImgIdx = 0;

    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem("th_cart") || "[]");
      const count = cart.reduce((s, i) => s + (i.qty || 1), 0);
      const topEl = document.getElementById("topCartCount");
      topEl.textContent = count; topEl.classList.toggle("show", count > 0);
      document.getElementById("bottomCartCount").textContent = count;
    }

    async function loadSettings() {
      try {
        const s = await getDoc(doc(db, "settings", "store"));
        if (s.exists()) {
          storeSettings = { ...storeSettings, ...s.data() };
          if (storeSettings.logoUrl) {
            document.querySelectorAll(".brand-logo-img").forEach(img => {
              img.src = storeSettings.logoUrl; img.style.display = "block";
              if (img.nextElementSibling) img.nextElementSibling.style.display = "none";
            });
          }
        }
      } catch (e) {}
    }

    async function init() {
      updateCartBadge(); await loadSettings();
      if (mode === "cart" || !productId) { renderCartCheckout(); return; }
      const snap = await getDoc(doc(db, "products", productId));
      if (!snap.exists()) { document.getElementById("mainContainer").innerHTML = `<div style="padding:60px;text-align:center;">প্রোডাক্ট পাওয়া যায়নি।</div>`; return; }

      currentProduct = { id: snap.id, ...snap.data() };
      galleryImages = [currentProduct.mainImage, ...(currentProduct.gallery || [])].filter(Boolean);
      if (!galleryImages.length) galleryImages = ["https://placehold.co/500x500/f8fafc/162d59?text=TH+SPORTS"];
      selectedVariant = (currentProduct.variants && currentProduct.variants.length) ? currentProduct.variants[0] : null;
      renderProductPage(); loadReviews(); loadRelatedProducts();
    }

    function renderProductPage() {
      const p = currentProduct;
      const activePrice = selectedVariant ? Number(selectedVariant.price || p.offerPrice || p.regularPrice) : Number(p.offerPrice || p.regularPrice);
      const regPrice = Number(p.regularPrice || activePrice);
      const activeStock = selectedVariant ? Number(selectedVariant.stock ?? p.stock ?? 0) : Number(p.stock ?? 0);
      const ratingCount = Number(p.reviewCount || 0), avgRating = Number(p.avgRating || 5);
      const starsHtml = "★".repeat(Math.round(avgRating)) + "☆".repeat(5 - Math.round(avgRating));

      document.getElementById("mainContainer").innerHTML = `
        <div class="top-intro">
          <div class="breadcrumb"><a href="index.html">হোম</a> <span>&gt;</span> <span>${esc(p.name)}</span></div>
          <h1 class="prod-main-title">${esc(p.name)}</h1>
        </div>
        <div class="showcase-wrap">
          <div class="gallery-card">
            <img id="mainGalleryImg" src="${esc(galleryImages[0])}" alt="${esc(p.name)}" />
            ${galleryImages.length > 1 ? `
              <button class="gal-arrow gal-prev" id="prevImg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
              <button class="gal-arrow gal-next" id="nextImg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
            ` : ''}
          </div>
        </div>
        <div class="thumb-strip">
          ${galleryImages.map((img, i) => `<div class="thumb-item ${i===0?'active':''}" data-idx="${i}"><img src="${esc(img)}" alt=""></div>`).join("")}
        </div>
        <div class="details-body">
          <div class="rating-summary">
            <span class="stars">${starsHtml}</span>
            <span>${toBn(ratingCount)} রিভিউস</span>
            <span class="add-rev-link" id="openRevBtn">রিভিউ যোগ করুন</span>
          </div>
          <div class="price-row">
            <div class="price-pill" id="livePrice">${formatPrice(activePrice)}</div>
            ${regPrice > activePrice ? `<div class="reg-strike">${formatPrice(regPrice)}</div>` : ''}
          </div>
          <div class="stock-text ${activeStock <= 0 ? 'out' : ''}" id="liveStock">
            ${activeStock > 0 ? `In stock (${toBn(activeStock)} টি স্টকে আছে)` : 'Out of stock'}
          </div>
          ${(p.variants && p.variants.length) ? `
            <div class="var-section">
              <div class="var-label">কালার / ভেরিয়েন্ট <strong id="varSelectedName">${esc(selectedVariant.name)}</strong></div>
              <div class="var-options">
                ${p.variants.map((v, idx) => `
                  <button class="var-btn ${idx===0?'active':''}" data-idx="${idx}">
                    ${v.color ? `<span class="color-swatch" style="background:${esc(v.color)};"></span>` : ''}
                    <span>${esc(v.name)}</span>
                  </button>
                `).join("")}
              </div>
            </div>
          ` : ''}
          <div class="action-stack">
            <button class="btn-navy" id="scrollOrderBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f04e23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg>
              অর্ডার করুন
            </button>
            <button class="btn-outline" id="addToCartBtn">কার্টে যোগ করুন</button>
            <a href="https://wa.me/${esc(storeSettings.whatsapp)}?text=${encodeURIComponent('অর্ডার করতে চাই: ' + p.name)}" target="_blank" class="btn-navy">মেসেজ করুন</a>
          </div>
          <div class="checkout-box" id="orderFormBox">
            <h3>অর্ডার কনফার্ম করতে তথ্য দিন</h3>
            <div class="form-group"><label>আপনার নাম *</label><input type="text" id="custName" class="form-control" placeholder="সম্পূর্ণ নাম লিখুন" /></div>
            <div class="form-group"><label>মোবাইল নম্বর *</label><input type="tel" id="custPhone" class="form-control" placeholder="01XXXXXXXXX" /></div>
            <div class="form-group"><label>সম্পূর্ণ ঠিকানা *</label><textarea id="custAddress" class="form-control" rows="2" placeholder="বাড়ি/গ্রাম, থানা, জেলা লিখুন"></textarea></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <div class="form-group"><label>পরিমাণ</label><input type="number" id="orderQty" class="form-control" value="1" min="1" /></div>
              <div class="form-group">
                <label>ডেলিভারি এরিয়া</label>
                <select id="deliveryArea" class="form-control">
                  <option value="${storeSettings.insideDhaka}">ঢাকার ভেতরে (${formatPrice(storeSettings.insideDhaka)})</option>
                  <option value="${storeSettings.outsideDhaka}">ঢাকার বাইরে (${formatPrice(storeSettings.outsideDhaka)})</option>
                </select>
              </div>
            </div>
            <div class="summary-line"><span>প্রোডাক্টের দাম:</span><strong id="sumSub">${formatPrice(activePrice)}</strong></div>
            <div class="summary-line"><span>ডেলিভারি চার্জ:</span><strong id="sumDel">${formatPrice(storeSettings.insideDhaka)}</strong></div>
            <div class="summary-total"><span>সর্বমোট (COD):</span><span id="sumTotal">${formatPrice(activePrice + Number(storeSettings.insideDhaka))}</span></div>
            <button class="btn-navy" id="confirmOrderBtn" style="margin-top:14px;background:var(--orange);">অর্ডার কনফার্ম করুন</button>
          </div>
        </div>
        <div class="section-card">
          <div class="section-heading">প্রোডাক্টের বিস্তারিত বিবরণ</div>
          <div class="desc-content">${esc(p.description || "বিস্তারিত তথ্য শীঘ্রই যুক্ত করা হবে।")}</div>
        </div>
        <div class="section-card">
          <div class="section-heading">কাস্টমার রিভিউ (${toBn(ratingCount)})</div>
          <div id="reviewsContainer">লোড হচ্ছে...</div>
        </div>
        <div class="section-card">
          <div class="section-heading">সম্পর্কিত প্রোডাক্ট</div>
          <div class="rel-grid" id="relatedGrid"></div>
        </div>
      `;

      const setImg = (idx) => {
        currentImgIdx = (idx + galleryImages.length) % galleryImages.length;
        document.getElementById("mainGalleryImg").src = galleryImages[currentImgIdx];
        document.querySelectorAll(".thumb-item").forEach((t, i) => t.classList.toggle("active", i === currentImgIdx));
      };
      document.getElementById("mainGalleryImg").onclick = () => { document.getElementById("zoomImg").src = galleryImages[currentImgIdx]; document.getElementById("zoomModal").classList.add("open"); };
      document.getElementById("prevImg")?.addEventListener("click", (e) => { e.stopPropagation(); setImg(currentImgIdx - 1); });
      document.getElementById("nextImg")?.addEventListener("click", (e) => { e.stopPropagation(); setImg(currentImgIdx + 1); });
      document.querySelectorAll(".thumb-item").forEach(t => t.onclick = () => setImg(Number(t.dataset.idx)));

      const updateTotals = () => {
        const price = selectedVariant ? Number(selectedVariant.price || p.offerPrice || p.regularPrice) : Number(p.offerPrice || p.regularPrice);
        const qty = Math.max(1, Number(document.getElementById("orderQty").value || 1));
        const del = Number(document.getElementById("deliveryArea").value || 0);
        document.getElementById("sumSub").textContent = formatPrice(price * qty);
        document.getElementById("sumDel").textContent = formatPrice(del);
        document.getElementById("sumTotal").textContent = formatPrice(price * qty + del);
      };

      document.querySelectorAll(".var-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(".var-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          selectedVariant = p.variants[Number(btn.dataset.idx)];
          const vPrice = Number(selectedVariant.price || p.offerPrice || p.regularPrice);
          const vStock = Number(selectedVariant.stock ?? p.stock ?? 0);
          document.getElementById("varSelectedName").textContent = selectedVariant.name;
          document.getElementById("livePrice").textContent = formatPrice(vPrice);
          const stockEl = document.getElementById("liveStock");
          stockEl.textContent = vStock > 0 ? `In stock (${toBn(vStock)} টি স্টকে আছে)` : "Out of stock";
          stockEl.classList.toggle("out", vStock <= 0);
          updateTotals();
        };
      });

      document.getElementById("orderQty").oninput = updateTotals;
      document.getElementById("deliveryArea").onchange = updateTotals;
      document.getElementById("scrollOrderBtn").onclick = () => document.getElementById("orderFormBox").scrollIntoView({ behavior: "smooth" });
      document.getElementById("openRevBtn").onclick = () => document.getElementById("reviewModal").classList.add("open");

      document.getElementById("addToCartBtn").onclick = () => {
        const cart = JSON.parse(localStorage.getItem("th_cart") || "[]");
        const price = selectedVariant ? Number(selectedVariant.price || p.offerPrice || p.regularPrice) : Number(p.offerPrice || p.regularPrice);
        const varName = selectedVariant ? selectedVariant.name : "";
        const qty = Math.max(1, Number(document.getElementById("orderQty").value || 1));
        const exist = cart.find(c => c.id === p.id && c.variant === varName);
        if (exist) exist.qty += qty;
        else cart.push({ id: p.id, name: p.name, price, image: galleryImages[0], variant: varName, qty });
        localStorage.setItem("th_cart", JSON.stringify(cart));
        updateCartBadge(); showToast("Added to Cart ✓");
      };

      document.getElementById("confirmOrderBtn").onclick = async () => {
        const name = document.getElementById("custName").value.trim(), phone = document.getElementById("custPhone").value.trim(), address = document.getElementById("custAddress").value.trim();
        if (!name || !phone || !address) return showToast("নাম, ফোন এবং ঠিকানা দিন");
        const qty = Math.max(1, Number(document.getElementById("orderQty").value || 1)), del = Number(document.getElementById("deliveryArea").value || 0);
        const price = selectedVariant ? Number(selectedVariant.price || p.offerPrice || p.regularPrice) : Number(p.offerPrice || p.regularPrice);
        const btn = document.getElementById("confirmOrderBtn"); btn.disabled = true; btn.textContent = "Processing...";
        try {
          const docRef = await addDoc(collection(db, "orders"), {
            customerName: name, phone, address,
            items: [{ productId: p.id, name: p.name, variant: selectedVariant ? selectedVariant.name : "", price, qty, image: galleryImages[0] }],
            subtotal: price * qty, deliveryCharge: del, totalAmount: price * qty + del, status: "Pending", createdAt: Date.now()
          });
          document.getElementById("orderFormBox").innerHTML = `
            <div style="text-align:center;padding:24px 10px;">
              <h3 style="color:#16a34a;margin-bottom:6px;">✓ অর্ডার কনফার্ম হয়েছে!</h3>
              <p>Order ID: <strong>#${docRef.id.slice(0,8).toUpperCase()}</strong></p>
              <a href="index.html" class="btn-navy" style="margin-top:16px;">Continue Shopping</a>
            </div>
          `;
        } catch (e) { showToast("Order failed"); btn.disabled = false; btn.textContent = "অর্ডার কনফার্ম করুন"; }
      };
    }

    async function loadReviews() {
      const snap = await getDocs(query(collection(db, "reviews"), where("productId", "==", productId)));
      const reviews = snap.docs.map(d => d.data()).sort((a,b) => b.createdAt - a.createdAt);
      const container = document.getElementById("reviewsContainer");
      if (!reviews.length) { container.innerHTML = `<p style="color:var(--muted);font-size:14px;">এখনও কোনো রিভিউ নেই।</p>`; return; }
      const avg = (reviews.reduce((s, r) => s + Number(r.rating), 0) / reviews.length).toFixed(1);
      const counts = [5,4,3,2,1].map(st => ({ st, n: reviews.filter(r => Number(r.rating) === st).length }));
      container.innerHTML = `
        <div class="rev-overview">
          <div>
            <div class="rev-big-score">${avg}<span style="font-size:15px;color:var(--muted)">/5</span></div>
            <div class="stars">${"★".repeat(Math.round(avg))}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px;">${toBn(reviews.length)} রিভিউ</div>
          </div>
          <div>${counts.map(c => `<div class="bar-row"><span style="width:24px;">${c.st}★</span><div class="bar-track"><div class="bar-fill" style="width:${(c.n/reviews.length)*100}%"></div></div><span style="width:20px;text-align:right;">${toBn(c.n)}</span></div>`).join("")}</div>
        </div>
        ${reviews.map(r => `<div class="rev-item"><div class="rev-author"><span>${esc(r.userName)}</span><span class="stars" style="font-size:13px;">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span></div><p style="font-size:13.5px;margin-top:4px;color:#334155;">${esc(r.comment)}</p></div>`).join("")}
      `;
    }

    document.getElementById("submitReviewBtn").onclick = async () => {
      const userName = document.getElementById("revName").value.trim(), rating = Number(document.getElementById("revRating").value), comment = document.getElementById("revComment").value.trim();
      if (!userName || !comment) return showToast("নাম এবং মতামত লিখুন");
      await addDoc(collection(db, "reviews"), { productId, userName, rating, comment, createdAt: Date.now() });
      const snap = await getDocs(query(collection(db, "reviews"), where("productId", "==", productId)));
      const revs = snap.docs.map(d => d.data());
      const avg = revs.reduce((s, r) => s + Number(r.rating), 0) / revs.length;
      await updateDoc(doc(db, "products", productId), { reviewCount: revs.length, avgRating: Number(avg.toFixed(1)) });
      document.getElementById("reviewModal").classList.remove("open");
      document.getElementById("revName").value = ""; document.getElementById("revComment").value = "";
      showToast("রিভিউ যুক্ত হয়েছে ✓"); loadReviews();
    };

    async function loadRelatedProducts() {
      if (!currentProduct?.categoryId) return;
      const snap = await getDocs(query(collection(db, "products"), where("categoryId", "==", currentProduct.categoryId)));
      const rel = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.id !== productId).slice(0, 4);
      const grid = document.getElementById("relatedGrid");
      if (!rel.length) { grid.innerHTML = `<p style="color:var(--muted);font-size:13px;">No related products.</p>`; return; }
      grid.innerHTML = rel.map(p => `<a href="checkout.html?id=${p.id}" class="rel-card"><img src="${esc(p.mainImage)}" alt=""><h4>${esc(p.name)}</h4><strong style="color:var(--orange);">${formatPrice(p.offerPrice || p.regularPrice)}</strong></a>`).join("");
    }

    function renderCartCheckout() {
      const cart = JSON.parse(localStorage.getItem("th_cart") || "[]");
      const container = document.getElementById("mainContainer");
      if (!cart.length) { container.innerHTML = `<div style="padding:70px 20px;text-align:center;"><h3 style="color:var(--navy);">Your Shopping Cart is Empty</h3><a href="index.html" class="btn-navy" style="max-width:220px;margin:18px auto;">Start Shopping</a></div>`; return; }
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      container.innerHTML = `
        <div style="padding:18px 16px;">
          <h2 style="color:var(--navy);margin-bottom:14px;">Shopping Cart</h2>
          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px;">
            ${cart.map((item, idx) => `
              <div style="display:flex;gap:12px;align-items:center;border:1px solid var(--border);padding:10px;border-radius:10px;">
                <img src="${esc(item.image)}" style="width:56px;height:56px;object-fit:contain;" />
                <div style="flex:1;">
                  <div style="font-weight:600;font-size:14px;">${esc(item.name)}</div>
                  ${item.variant ? `<div style="font-size:12px;color:var(--muted);">${esc(item.variant)}</div>` : ''}
                  <div style="color:var(--orange);font-weight:700;">${formatPrice(item.price)} × ${toBn(item.qty)}</div>
                </div>
                <button class="icon-btn" onclick="removeCartItem(${idx})" style="color:#dc2626;font-size:18px;">✕</button>
              </div>
            `).join("")}
          </div>
          <div class="checkout-box">
            <h3>ডেলিভারি তথ্য দিন</h3>
            <div class="form-group"><label>নাম *</label><input id="cName" class="form-control" /></div>
            <div class="form-group"><label>মোবাইল নম্বর *</label><input id="cPhone" class="form-control" /></div>
            <div class="form-group"><label>ঠিকানা *</label><textarea id="cAddr" class="form-control" rows="2"></textarea></div>
            <div class="form-group"><label>ডেলিভারি এরিয়া</label><select id="cDel" class="form-control"><option value="${storeSettings.insideDhaka}">ঢাকার ভেতরে (${formatPrice(storeSettings.insideDhaka)})</option><option value="${storeSettings.outsideDhaka}">ঢাকার বাইরে (${formatPrice(storeSettings.outsideDhaka)})</option></select></div>
            <div class="summary-line"><span>সাবটোটাল:</span><strong>${formatPrice(subtotal)}</strong></div>
            <div class="summary-line"><span>ডেলিভারি চার্জ:</span><strong id="cDelShow">${formatPrice(storeSettings.insideDhaka)}</strong></div>
            <div class="summary-total"><span>সর্বমোট:</span><span id="cTotalShow">${formatPrice(subtotal + Number(storeSettings.insideDhaka))}</span></div>
            <button class="btn-navy" id="placeCartOrderBtn" style="margin-top:14px;background:var(--orange);">অর্ডার কনফার্ম করুন</button>
          </div>
        </div>
      `;
      window.removeCartItem = (idx) => { cart.splice(idx, 1); localStorage.setItem("th_cart", JSON.stringify(cart)); updateCartBadge(); renderCartCheckout(); };
      document.getElementById("cDel").onchange = (e) => { const d = Number(e.target.value); document.getElementById("cDelShow").textContent = formatPrice(d); document.getElementById("cTotalShow").textContent = formatPrice(subtotal + d); };
      document.getElementById("placeCartOrderBtn").onclick = async () => {
        const customerName = document.getElementById("cName").value.trim(), phone = document.getElementById("cPhone").value.trim(), address = document.getElementById("cAddr").value.trim(), deliveryCharge = Number(document.getElementById("cDel").value);
        if (!customerName || !phone || !address) return showToast("সব তথ্য পূরণ করুন");
        const ref = await addDoc(collection(db, "orders"), {
          customerName, phone, address, items: cart.map(c => ({ productId: c.id, name: c.name, variant: c.variant || "", price: c.price, qty: c.qty, image: c.image })),
          subtotal, deliveryCharge, totalAmount: subtotal + deliveryCharge, status: "Pending", createdAt: Date.now()
        });
        localStorage.removeItem("th_cart"); updateCartBadge();
        container.innerHTML = `<div style="padding:60px 20px;text-align:center;"><h2 style="color:#16a34a;margin-bottom:8px;">✓ অর্ডার কনফার্ম হয়েছে!</h2><p>Order ID: <strong>#${ref.id.slice(0,8).toUpperCase()}</strong></p><a href="index.html" class="btn-navy" style="max-width:220px;margin:20px auto;">Continue Shopping</a></div>`;
      };
    }

    init();
  </script>
</body>
</html>
