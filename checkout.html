<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #162d59; --navy-deep: #0c1a36; --orange: #f04e23; --bg: #f5f7fb; --border: #e2e8f0; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif;
      background: #ffffff; color: var(--text); padding-bottom: 64px;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    @media (min-width: 992px) { body { padding-bottom: 0; } }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; }

    .header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.96); backdrop-filter: blur(12px); height: 60px; border-bottom: 1px solid var(--border); padding: 0 16px; }
    .header-inner { max-width: 1050px; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .icon-btn { background: none; border: none; color: #1e293b; cursor: pointer; position: relative; display: inline-flex; padding: 4px; }
    .icon-btn svg { width: 22px; height: 22px; stroke-width: 1.85; }
    .cart-badge {
      position: absolute; top: -3px; right: -6px; background: var(--orange); color: #fff;
      font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 99px;
      display: none; align-items: center; justify-content: center; border: 1.5px solid #fff;
    }
    .cart-badge.show { display: flex; }

    .brand-logo { display: flex; align-items: center; gap: 9px; }
    .logo-circle {
      width: 38px; height: 38px; border-radius: 50%; overflow: hidden;
      border: 1.8px solid var(--orange); background: var(--navy);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand-text-col { display: flex; flex-direction: column; line-height: 1; }
    .brand-title { font-size: 19px; font-weight: 800; font-style: italic; letter-spacing: -0.5px; color: var(--navy); }
    .brand-sub { font-size: 8px; font-weight: 700; letter-spacing: 3px; color: var(--orange); text-align: right; margin-top: 2px; }

    .container { max-width: 980px; width: 100%; margin: 0 auto; flex: 1; }
    .top-intro { background: #f6f8fc; padding: 14px 16px 16px; }
    .breadcrumb { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .prod-main-title { font-size: 18px; font-weight: 700; color: var(--navy); line-height: 1.35; }

    /* Media Gallery (Images + Videos) */
    .showcase-wrap { padding: 14px 14px 8px; background: #fff; }
    .gallery-card {
      position: relative; width: 100%; background: #fff;
      border: 1.5px solid rgba(240, 78, 35, 0.65); border-radius: 16px;
      padding: 10px; overflow: hidden; min-height: 260px; display: flex; align-items: center; justify-content: center;
    }
    .gallery-card img { width: 100%; max-height: 400px; object-fit: contain; display: block; cursor: zoom-in; }
    .gallery-card iframe, .gallery-card video { width: 100%; aspect-ratio: 16/9; max-height: 400px; border-radius: 10px; border: none; background: #000; }
    .gal-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.92);
      border: 1px solid var(--border); width: 34px; height: 34px; border-radius: 50%; color: var(--orange);
      cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5;
    }
    .gal-prev { left: 8px; } .gal-next { right: 8px; }

    .thumb-strip { display: flex; gap: 9px; padding: 10px 14px; overflow-x: auto; }
    .thumb-item {
      width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; border: 1.5px solid var(--border);
      overflow: hidden; cursor: pointer; background: #fff; padding: 3px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .thumb-item.active { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(240,78,35,0.2); }
    .thumb-item img { width: 100%; height: 100%; object-fit: contain; }
    .thumb-vid-badge { position: absolute; inset: 0; background: rgba(15,23,42,0.45); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }

    .details-body { padding: 6px 16px 20px; }
    .rating-summary { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13.5px; }
    .stars { color: var(--orange); font-size: 15px; letter-spacing: 1px; }
    .add-rev-link { color: #1d4ed8; text-decoration: underline; cursor: pointer; font-weight: 500; }

    .price-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .price-pill { background: var(--orange); color: #fff; font-size: 22px; font-weight: 800; padding: 6px 15px; border-radius: 8px; }
    .reg-strike { font-size: 16px; color: #475569; text-decoration: line-through; text-decoration-color: #ef4444; text-decoration-thickness: 1.8px; }
    .stock-text { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 14px; }
    .stock-text.out { color: #dc2626; }

    .var-section { margin-bottom: 16px; }
    .var-label { font-size: 13.5px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 8px; }
    .var-label strong { color: var(--text); }
    .var-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .var-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1.5px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
    .var-btn.active { border-color: var(--navy); box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--navy); }
    .color-swatch { width: 18px; height: 14px; border-radius: 3px; border: 1px solid #cbd5e1; }

    .action-stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .btn-navy { width: 100%; background: var(--navy); color: #fff; border: none; height: 48px; border-radius: 10px; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; transition: background 0.15s; }
    .btn-navy:hover { background: var(--navy-deep); }
    .btn-orange { background: var(--orange); }
    .btn-orange:hover { background: #d94118; }
    .btn-outline { width: 100%; background: #fff; color: var(--navy); border: 1.5px solid var(--navy); height: 44px; border-radius: 10px; font-size: 14.5px; font-weight: 700; cursor: pointer; }

    .section-card { border-top: 8px solid #f1f5f9; padding: 18px 16px; }
    .section-heading { font-size: 16.5px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
    .desc-content { font-size: 14px; line-height: 1.75; white-space: pre-line; color: #334155; }

    .rev-overview { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; background: #f8fafc; padding: 14px; border-radius: 12px; margin-bottom: 12px; }
    .rev-big-score { font-size: 32px; font-weight: 800; color: var(--navy); line-height: 1; }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; color: var(--muted); }
    .bar-track { flex: 1; height: 7px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--orange); border-radius: 99px; }
    .rev-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
    .rev-item:last-child { border-bottom: none; }

    .rel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 768px) { .rel-grid { grid-template-columns: repeat(4, 1fr); } }
    .rel-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: #fff; }
    .rel-card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; }
    .rel-card h4 { font-size: 13px; margin: 6px 0 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Dedicated Separate Order Checkout View */
    .checkout-page-wrap { max-width: 680px; margin: 0 auto; padding: 16px; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .checkout-card { background: #fff; border: 1.5px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(15,23,42,0.04); }
    .checkout-card h3 { font-size: 16px; color: var(--navy); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff; outline: none; }
    .form-control:focus { border-color: var(--navy); }

    /* Payment Rule Radio Cards */
    .pay-option-card {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; cursor: pointer;
      transition: all 0.18s;
    }
    .pay-option-card.active { border-color: var(--orange); background: #fffaf8; }
    .pay-option-left { display: flex; align-items: center; gap: 10px; }
    .pay-option-left input { width: 17px; height: 17px; accent-color: var(--orange); }
    .pay-option-title { font-size: 13.5px; font-weight: 700; color: var(--navy); }
    .pay-option-sub { font-size: 11.5px; color: var(--muted); }
    .pay-option-amt { font-size: 14px; font-weight: 800; color: var(--orange); white-space: nowrap; }

    /* Gateway Selector Cards */
    .gw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
    .gw-card {
      border: 1.5px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer;
      text-align: center; transition: all 0.18s; background: #fff;
    }
    .gw-card.active { border-color: var(--navy); background: #f0f4ff; box-shadow: 0 2px 8px rgba(22,45,89,0.12); }
    .gw-badge { font-size: 14px; font-weight: 800; display: block; margin-bottom: 3px; }
    .gw-bkash { color: #e2136e; } .gw-nagad { color: #f7941d; } .gw-rocket { color: #8c3494; }

    .summary-line { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; color: #334155; }
    .summary-total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 800; color: var(--navy); border-top: 1.5px dashed #cbd5e1; padding-top: 10px; margin-top: 8px; }

    /* Order Confirmation Animation */
    .confirm-wrap { max-width: 520px; margin: 28px auto; padding: 28px 20px; text-align: center; background: #fff; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 12px 34px rgba(15,23,42,0.07); animation: popIn 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .check-anim { width: 78px; height: 78px; margin: 0 auto 14px; display: block; }
    .check-circle { stroke: #16a34a; stroke-width: 3; fill: #dcfce7; stroke-dasharray: 220; stroke-dashoffset: 220; animation: drawCircle 0.6s ease forwards; }
    .check-mark { stroke: #16a34a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-dasharray: 60; stroke-dashoffset: 60; animation: drawCheck 0.4s 0.45s ease forwards; }
    @keyframes drawCircle { to { stroke-dashoffset: 0; } }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    .site-footer { background: linear-gradient(180deg, #102145 0%, #0a152e 100%); color: #cbd5e1; padding: 28px 18px 20px; border-top: 2px solid var(--orange); margin-top: auto; }
    .footer-inner { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
    .footer-copy { max-width: 980px; margin: 16px auto 0; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #64748b; text-align: center; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.92); z-index: 500; align-items: center; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal img { max-width: 100%; max-height: 92vh; object-fit: contain; }
    .modal-close { position: fixed; top: 16px; right: 16px; background: #fff; color: #0f172a; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 20px; cursor: pointer; }
    .rev-modal-box { background: #fff; padding: 22px; border-radius: 14px; width: 100%; max-width: 420px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--navy); display: flex; justify-content: space-around; align-items: center; z-index: 150; }
    @media (min-width: 992px) { .bottom-nav { display: none; } }
    .bnav-item { display: flex; flex-direction: column; align-items: center; color: #fff; font-size: 10px; font-weight: 700; gap: 4px; position: relative; }
    .bnav-item svg { width: 20px; height: 20px; stroke: var(--orange); stroke-width: 2; }
    .bnav-badge { position: absolute; top: -6px; right: -8px; background: var(--orange); color: #fff; font-size: 9.5px; min-width: 16px; height: 16px; border-radius: 99px; display: flex; align-items: center; justify-content: center; }

    .toast { position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%); background: var(--navy-deep); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 300; white-space: nowrap; }
    .toast.show { opacity: 1; }
  </style>
</head>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs, addDoc, updateDoc, runTransaction, query, where } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7qQLrHIDOOxxSUcDsjR5EcHO4-0mByNQ",
      authDomain: "th-sports-afd52.firebaseapp.com",
      projectId: "th-sports-afd52",
      storageBucket: "th-sports-afd52.firebasestorage.app",
      messagingSenderId: "479595748038",
      appId: "1:479595748038:web:0a0f2389d2b9f13aa215c7",
      measurementId: "G-H8L744Y578"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const params = new URLSearchParams(location.search);
    const productId = params.get("id");
    const mode = params.get("mode");
    const confirmedParam = params.get("confirmed");
    const stepParam = params.get("step");

    const toBn = (n) => String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
    const formatPrice = (n) => toBn(Number(n || 0).toLocaleString("en-US")) + "৳";
    const esc = (s) => String(s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function showToast(msg) { const t = document.getElementById("toastBox"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }

    let storeSettings = {
      logoUrl: "", whatsapp: "8801700000000",
      ishwardiCharge: 60, outsideIshwardiCharge: 120,
      gateways: {
        bkash: { enabled: true, number: "", type: "Personal", instruction: "Send Money করুন" },
        nagad: { enabled: false, number: "", type: "Personal", instruction: "Send Money করুন" },
        rocket: { enabled: false, number: "", type: "Personal", instruction: "Send Money করুন" }
      }
    };
    let currentProduct = null, selectedVariant = null, mediaItems = [], currentMediaIdx = 0;
    let inCheckoutView = false;

    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem("th_cart") || "[]");
      const count = cart.reduce((s, i) => s + (i.qty || 1), 0);
      const topEl = document.getElementById("topCartCount");
      topEl.textContent = count; topEl.classList.toggle("show", count > 0);
      document.getElementById("bottomCartCount").textContent = count;
    }

    // Back Button Handling (Header + Mobile Hardware Back)
    document.getElementById("headerBackBtn").onclick = () => {
      if (inCheckoutView && currentProduct) history.back();
      else location.href = "index.html";
    };

    window.addEventListener("popstate", () => {
      if (document.getElementById("zoomModal").classList.contains("open")) {
        document.getElementById("zoomModal").classList.remove("open"); return;
      }
      if (document.getElementById("reviewModal").classList.contains("open")) {
        document.getElementById("reviewModal").classList.remove("open"); return;
      }
      if (inCheckoutView && currentProduct) {
        inCheckoutView = false;
        renderProductPage();
        loadReviews();
        loadRelatedProducts();
      }
    });

    function extractYoutubeId(url) {
      const m = String(url || "").match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    async function generateNextOrderCode() {
      try {
        const counterRef = doc(db, "counters", "orders");
        const nextSeq = await runTransaction(db, async (tx) => {
          const snap = await tx.get(counterRef);
          const next = snap.exists() ? Number(snap.data().seq || 0) + 1 : 1;
          tx.set(counterRef, { seq: next });
          return next;
        });
        return { orderSeq: nextSeq, orderCode: "TH" + String(nextSeq).padStart(2, "0") };
      } catch (e) {
        const fallback = Math.floor(100 + Math.random() * 900);
        return { orderSeq: fallback, orderCode: "TH" + fallback };
      }
    }

    async function loadSettings() {
      try {
        const s = await getDoc(doc(db, "settings", "store"));
        if (s.exists()) {
          const d = s.data();
          storeSettings = {
            ...storeSettings, ...d,
            ishwardiCharge: d.ishwardiCharge ?? d.insideDhaka ?? 60,
            outsideIshwardiCharge: d.outsideIshwardiCharge ?? d.outsideDhaka ?? 120,
            gateways: { ...storeSettings.gateways, ...(d.gateways || {}) }
          };
          if (storeSettings.logoUrl) {
            document.querySelectorAll(".brand-logo-img").forEach(img => img.src = storeSettings.logoUrl);
          }
        }
      } catch (e) {}
    }

    async function init() {
      updateCartBadge();
      await loadSettings();

      if (confirmedParam === "1") {
        renderOrderConfirmedScreen();
        return;
      }

      if (mode === "cart" || !productId) {
        renderCartCheckout();
        return;
      }

      const snap = await getDoc(doc(db, "products", productId));
      if (!snap.exists()) {
        document.getElementById("mainContainer").innerHTML = `<div style="padding:60px;text-align:center;">প্রোডাক্ট পাওয়া যায়নি।</div>`;

      currentProduct = { id: snap.id, ...snap.data() };
      const imgs = [currentProduct.mainImage, ...(currentProduct.gallery || [])].filter(Boolean);
      const vids = (currentProduct.videoUrls || []).filter(Boolean);
      mediaItems = [
        ...imgs.map(u => ({ type: "image", url: u })),
        ...vids.map(u => ({ type: "video", url: u, ytId: extractYoutubeId(u) }))
      ];
      if (!mediaItems.length) mediaItems = [{ type: "image", url: "https://placehold.co/500x500/f8fafc/162d59?text=TH+SPORTS" }];
      selectedVariant = (currentProduct.variants && currentProduct.variants.length) ? currentProduct.variants[0] : null;

      if (stepParam === "order") {
        openSingleProductCheckoutView(1, false);
      } else {
        renderProductPage();
        loadReviews();
        loadRelatedProducts();
      }
    }

    // Build Payment Plans strictly from Admin Product Rules
    function buildPaymentPlans(items, subtotal, deliveryCharge) {
      const total = subtotal + deliveryCharge;
      let allowCOD = true;
      let allowAdvDel = false;
      let allowFixedAdv = false;
      let fixedAmount = 0;
      let allowFull = false;
      let note = "";

      if (items.length === 1 && items[0].paymentRules) {
        const r = items[0].paymentRules;
        allowCOD = r.allowCOD !== false;
        allowAdvDel = !!r.allowAdvanceDelivery;
        allowFixedAdv = !!r.allowFixedAdvance && Number(r.fixedAdvanceAmount) > 0;
        fixedAmount = Number(r.fixedAdvanceAmount || 0);
        allowFull = !!r.allowFullPayment;
        note = r.paymentNote || "";
      } else if (items.length > 1) {
        allowCOD = items.every(i => !i.paymentRules || i.paymentRules.allowCOD !== false);
        allowAdvDel = items.some(i => i.paymentRules?.allowAdvanceDelivery);
        allowFixedAdv = items.some(i => i.paymentRules?.allowFixedAdvance && Number(i.paymentRules?.fixedAdvanceAmount) > 0);
        fixedAmount = items.reduce((mx, i) => Math.max(mx, Number(i.paymentRules?.fixedAdvanceAmount || 0)), 0);
        allowFull = items.some(i => i.paymentRules?.allowFullPayment);
      }

      const plans = [];
      if (allowCOD) {
        plans.push({ id: "cod", title: "Cash on Delivery (COD)", sub: "পণ্য হাতে পেয়ে সম্পূর্ণ টাকা পরিশোধ করুন", payNow: 0, due: total, isOnline: false });
      }
      if (allowAdvDel) {
        plans.push({ id: "advance_delivery", title: "শুধু ডেলিভারি চার্জ অ্যাডভান্স", sub: "ডেলিভারি চার্জ অগ্রিম, বাকি টাকা পণ্যের সাথে", payNow: deliveryCharge, due: subtotal, isOnline: true });
      }
      if (allowFixedAdv && fixedAmount > 0) {
        const adv = Math.min(total, fixedAmount);
        plans.push({ id: "fixed_advance", title: `অ্যাডভান্স পেমেন্ট (${formatPrice(adv)})`, sub: "নির্দিষ্ট অগ্রিম পরিশোধ, বাকি টাকা কুরিয়ারে", payNow: adv, due: total - adv, isOnline: true });
      }
      if (allowFull) {
        plans.push({ id: "full", title: "সম্পূর্ণ পেমেন্ট (Full Payment)", sub: "সম্পূর্ণ বিল অগ্রিম পরিশোধ করুন (COD: ০৳)", payNow: total, due: 0, isOnline: true });
      }
      if (!plans.length) {
        plans.push({ id: "advance_delivery", title: "ডেলিভারি চার্জ অ্যাডভান্স", sub: "অর্ডার কনফার্ম করতে ডেলিভারি চার্জ অগ্রিম দিন", payNow: deliveryCharge, due: subtotal, isOnline: true });
      }
      return { plans, note };
    }

              </div>
            </div>
            <span class="pay-option-amt">${pl.payNow > 0 ? formatPrice(pl.payNow) : '০৳ অগ্রিম'}</span>
          </label>
        `).join("");

        document.querySelectorAll('input[name="payPlan"]').forEach(r => {
          r.onchange = () => { selectedPlanId = r.value; refreshCalculations(); };
        });

        document.getElementById("ckGatewaySection").style.display = activePlan.isOnline ? "block" : "none";
        document.getElementById("sumSub").textContent = formatPrice(sub);
        document.getElementById("sumDel").textContent = formatPrice(del);
        document.getElementById("sumTotal").textContent = formatPrice(sub + del);
        document.getElementById("sumPayNow").textContent = formatPrice(activePlan.payNow);
        document.getElementById("sumDue").textContent = formatPrice(activePlan.due);

        const btn = document.getElementById("placeOrderBtn");
        btn.textContent = activePlan.isOnline
          ? `পেমেন্ট গেটওয়েতে যান (${formatPrice(activePlan.payNow)})`
          : "অর্ডার কনফার্ম করুন (COD)";
      };

      document.getElementById("ckGatewayGrid")?.addEventListener("click", (e) => {
        const card = e.target.closest(".gw-card"); if (!card) return;
        selectedGateway = card.dataset.gw;
        document.querySelectorAll(".gw-card").forEach(c => c.classList.toggle("active", c === card));
      });

      document.getElementById("ckDeliveryZone").onchange = refreshCalculations;

      if (!isCart) {
        document.getElementById("qtyIncBtn").onclick = () => {
          items[0].qty += 1;
          document.getElementById("qtyShow").textContent = toBn(items[0].qty);
          refreshCalculations();
        };
        document.getElementById("qtyDecBtn").onclick = () => {
          if (items[0].qty > 1) {
            items[0].qty -= 1;
            document.getElementById("qtyShow").textContent = toBn(items[0].qty);
            refreshCalculations();
          }
        };
      } else {
        window.removeCartIdx = (idx) => {
          const cart = JSON.parse(localStorage.getItem("th_cart") || "[]");
          cart.splice(idx, 1);
          localStorage.setItem("th_cart", JSON.stringify(cart));
          updateCartBadge();
          renderCartCheckout();
        };
      }

      refreshCalculations();

      document.getElementById("placeOrderBtn").onclick = async () => {
        const customerName = document.getElementById("ckName").value.trim();
        const phone = document.getElementById("ckPhone").value.trim();
        const address = document.getElementById("ckAddress").value.trim();
        if (!customerName || !phone || !address) return showToast("অনুগ্রহ করে নাম, ফোন এবং ঠিকানা দিন");

        const sub = getSubtotal();
        const del = getDeliveryCharge();
        const zone = document.getElementById("ckDeliveryZone").value;
        const { plans } = buildPaymentPlans(items, sub, del);
        const activePlan = plans.find(pl => pl.id === selectedPlanId);

        const cleanItems = items.map(i => ({ productId: i.productId, name: i.name, variant: i.variant || "", price: i.price, qty: i.qty, image: i.image || "" }));

        // If Online / Advance payment selected -> redirect to paymentgetway.html
        if (activePlan.isOnline) {
          if (!selectedGateway) return showToast("পেমেন্ট মাধ্যম (bKash/Nagad/Rocket) সিলেক্ট করুন");
          sessionStorage.setItem("th_pending_order", JSON.stringify({
            isCart, customerName, phone, address, deliveryZone: zone,
            items: cleanItems, subtotal: sub, deliveryCharge: del, totalAmount: sub + del,
            paymentPlan: activePlan.id, payAmount: activePlan.payNow, dueAmount: activePlan.due,
            gateway: selectedGateway
          }));
          location.href = `paymentgetway.html?gw=${encodeURIComponent(selectedGateway)}&amount=${activePlan.payNow}`;
          return;
        }

        // Otherwise COD Direct Order
        const btn = document.getElementById("placeOrderBtn");
        btn.disabled = true; btn.textContent = "অর্ডার প্রক্রিয়াকরণ হচ্ছে...";
        try {
          const { orderSeq, orderCode } = await generateNextOrderCode();
          await addDoc(collection(db, "orders"), {
            orderSeq, orderCode, customerName, phone, address, deliveryZone: zone,
            items: cleanItems, subtotal: sub, deliveryCharge: del, totalAmount: sub + del,
            paidAmount: 0, dueAmount: sub + del,
            paymentMethod: "COD", paymentPlan: "cod", paymentStatus: "Unpaid",
            status: "Pending", createdAt: Date.now()
          });
          if (isCart) { localStorage.removeItem("th_cart"); updateCartBadge(); }
          sessionStorage.setItem("th_confirmed_order", JSON.stringify({
            orderCode, customerName, totalAmount: sub + del, paidAmount: 0, dueAmount: sub + del, paymentMethod: "COD"
          }));
          location.href = "checkout.html?confirmed=1";
        } catch (err) {
          showToast("অর্ডার সাবমিট ব্যর্থ হয়েছে");
          btn.disabled = false; btn.textContent = "অর্ডার কনফার্ম করুন (COD)";
        }
      };
    }

    function renderOrderConfirmedScreen() {
      const info = JSON.parse(sessionStorage.getItem("th_confirmed_order") || "null") || {};
      document.getElementById("mainContainer").innerHTML = `
        <div class="confirm-wrap">
          <svg class="check-anim" viewBox="0 0 80 80">
            <circle class="check-circle" cx="40" cy="40" r="35" />
            <path class="check-mark" d="M24 41 L35 52 L57 29" />
          </svg>
          <h2 style="color:#16a34a;font-size:22px;margin-bottom:6px;">অর্ডার কনফার্ম হয়েছে!</h2>
          <p style="font-size:14px;color:var(--muted);margin-bottom:14px;">ধন্যবাদ ${esc(info.customerName || '')}, আপনার অর্ডারটি সফলভাবে গৃহীত হয়েছে।</p>
          <div style="background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:left;font-size:13.5px;line-height:1.85;margin-bottom:18px;">
            <div style="display:flex;justify-content:space-between;"><span>Order ID:</span><strong style="color:var(--navy);font-size:15px;">${esc(info.orderCode || 'TH01')}</strong></div>
            <div style="display:flex;justify-content:space-between;"><span>মোট বিল:</span><strong>${formatPrice(info.totalAmount || 0)}</strong></div>
            <div style="display:flex;justify-content:space-between;color:#16a34a;"><span>অ্যাডভান্স পেইড (${esc(info.paymentMethod || 'COD')}):</span><strong>${formatPrice(info.paidAmount || 0)}</strong></div>
            <div style="display:flex;justify-content:space-between;color:var(--orange);"><span>ডেলিভারিতে বাকি (COD):</span><strong>${formatPrice(info.dueAmount ?? info.totalAmount ?? 0)}</strong></div>
          </div>
          <a href="index.html" class="btn-navy">আরও শপিং করুন</a>
        </div>
      `;
    }

    // Reviews & Related
    async function loadReviews() {
      const snap = await getDocs(query(collection(db, "reviews"), where("productId", "==", productId)));
      const reviews = snap.docs.map(d => d.data()).sort((a,b) => b.createdAt - a.createdAt);
      const container = document.getElementById("reviewsContainer");
      if (!container) return;
      if (!reviews.length) { container.innerHTML = `<p style="color:var(--muted);font-size:13.5px;">এখনও কোনো রিভিউ নেই।</p>`; return; }
      const avg = (reviews.reduce((s, r) => s + Number(r.rating), 0) / reviews.length).toFixed(1);
      const counts = [5,4,3,2,1].map(st => ({ st, n: reviews.filter(r => Number(r.rating) === st).length }));
      container.innerHTML = `
        <div class="rev-overview">
          <div>
            <div class="rev-big-score">${avg}<span style="font-size:14px;color:var(--muted)">/5</span></div>
            <div class="stars">${"★".repeat(Math.round(avg))}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:3px;">${toBn(reviews.length)} রিভিউ</div>
          </div>
          <div>${counts.map(c => `<div class="bar-row"><span style="width:24px;">${c.st}★</span><div class="bar-track"><div class="bar-fill" style="width:${(c.n/reviews.length)*100}%"></div></div><span style="width:20px;text-align:right;">${toBn(c.n)}</span></div>`).join("")}</div>
        </div>
        ${reviews.map(r => `<div class="rev-item"><div style="display:flex;justify-content:space-between;font-weight:600;font-size:13px;"><span>${esc(r.userName)}</span><span class="stars" style="font-size:13px;">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span></div><p style="font-size:13px;margin-top:3px;color:#334155;">${esc(r.comment)}</p></div>`).join("")}
      `;
    }

    document.getElementById("submitReviewBtn").onclick = async () => {
      const userName = document.getElementById("revName").value.trim(), rating = Number(document.getElementById("revRating").value), comment = document.getElementById("revComment").value.trim();
      if (!userName || !comment) return showToast("নাম এবং মতামত লিখুন");
      await addDoc(collection(db, "reviews"), { productId, userName, rating, comment, createdAt: Date.now() });
      const snap = await getDocs(query(collection(db, "reviews"), where("productId", "==", productId)));
      const revs = snap.docs.map(d => d.data());
      const avg = revs.reduce((s, r) => s + Number(r.rating), 0) / revs.length;
      await updateDoc(doc(db, "products", productId), { reviewCount: revs.length, avgRating: Number(avg.toFixed(1)) });
      document.getElementById("reviewModal").classList.remove("open");
      document.getElementById("revName").value = ""; document.getElementById("revComment").value = "";
      showToast("রিভিউ যুক্ত হয়েছে ✓"); loadReviews();
    };
    document.getElementById("cancelRevBtn").onclick = () => document.getElementById("reviewModal").classList.remove("open");
    document.getElementById("closeZoomBtn").onclick = () => document.getElementById("zoomModal").classList.remove("open");

    async function loadRelatedProducts() {
      if (!currentProduct?.categoryId) return;
      const snap = await getDocs(query(collection(db, "products"), where("categoryId", "==", currentProduct.categoryId)));
      const rel = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.id !== productId).slice(0, 4);
      const grid = document.getElementById("relatedGrid");
      if (!grid) return;
      if (!rel.length) { grid.innerHTML = `<p style="color:var(--muted);font-size:13px;">সম্পর্কিত প্রোডাক্ট নেই।</p>`; return; }
      grid.innerHTML = rel.map(p => `<a href="checkout.html?id=${p.id}" class="rel-card"><img src="${esc(p.mainImage)}" alt=""><h4>${esc(p.name)}</h4><strong style="color:var(--orange);">${formatPrice(p.offerPrice || p.regularPrice)}</strong></a>`).join("");
    }

    init();
  </script>
</body>
</html>
